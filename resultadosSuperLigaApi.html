<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Resultados Super Liga</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    h2 { text-align: center; margin-bottom: 30px; }
    #filtro-liga, #filtro-division { margin-bottom: 20px; margin-right: 10px; }
  </style>
</head>
<body>

  <h2>RESULTADOS SUPER LIGA</h2>

  <label for="filtro-liga">Filtrar por Liga:</label>
  <select id="filtro-liga"><option value="">Cargando ligas...</option></select>

  <label for="filtro-division">Filtrar por División:</label>
  <select id="filtro-division"><option value="">Todas</option></select>

  <table id="tabla-resultados" class="display" style="width:100%">
    <thead>
      <tr>
        <th>División</th>
        <th>Pareja 1</th>
        <th>Pareja 2</th>
        <th>Set 1</th>
        <th>Set 2</th>
        <th>Set 3</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const API_BASE = 'https://club-padel-api-12f28391bbbd.herokuapp.com';
    const AUTH_HEADER = { 'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz' };

    let divisionMap = {};
    let dataTable;
    let ligaActualId = null;

    function cargarLigas() {
      $.ajax({
        url: `${API_BASE}/ligas`,
        headers: AUTH_HEADER,
        success: function(ligas) {
          const select = $('#filtro-liga');
          select.empty();
          ligas.forEach(l => {
            select.append(`<option value="${l.id}" ${l.current ? 'selected' : ''}>${l.nombre}</option>`);
            if (l.current) ligaActualId = l.id;
          });
          cargarDivisiones();
          cargarResultados(ligaActualId);
        }
      });

      $('#filtro-liga').on('change', function() {
        ligaActualId = $(this).val();
        cargarResultados(ligaActualId);
      });
    }

    function cargarDivisiones() {
      $.ajax({
        url: `${API_BASE}/divisiones`,
        headers: AUTH_HEADER,
        success: function(divisiones) {
          const select = $('#filtro-division');
          select.empty().append('<option value="">Todas</option>');
          divisiones.forEach(d => {
            divisionMap[d.id] = d.nombre;
            select.append(`<option value="${d.id}">${d.nombre}</option>`);
          });
        }
      });

      $('#filtro-division').on('change', function () {
        cargarResultados(ligaActualId);
      });
    }

    function cargarResultados(ligaId) {
      if (!ligaId) return;

      $.ajax({
        url: `${API_BASE}/resultados/liga/${ligaId}`,
        headers: AUTH_HEADER,
        success: function(resultados) {
          const filtroDivision = $('#filtro-division').val();
          const filtrados = filtroDivision ? resultados.filter(r => r.division.id == filtroDivision) : resultados;

          const datos = filtrados.map(r => [
            divisionMap[r.division.id] || `División ${r.division.id}`,
            `${r.pareja1.jugador1.nombre} / ${r.pareja1.jugador2.nombre}`,
            `${r.pareja2.jugador1.nombre} / ${r.pareja2.jugador2.nombre}`,
            `${r.set1P1} - ${r.set1P2}`,
            `${r.set2P1} - ${r.set2P2}`,
            `${r.set3P1} - ${r.set3P2}`
          ]);

          dataTable.clear().rows.add(datos).draw();
        }
      });
    }

    $(document).ready(function () {
      dataTable = $('#tabla-resultados').DataTable({
        language: { url: 'https://cdn.datatables.net/plug-ins/1.13.4/i18n/es-ES.json' }
      });

      cargarLigas();
    });
  </script>

</body>
</html>

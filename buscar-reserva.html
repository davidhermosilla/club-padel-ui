<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buscar Reservas</title>

  <style>
    :root{
      --bg:#f7f9fc; --card:#fff; --ink:#0f172a; --muted:#64748b; --brand:#1e73be; --line:#e5e7eb;
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial; background:var(--bg); color:var(--ink)}
    .wrap{max-width:1100px;margin:32px auto;padding:0 16px}
    h1{font-size:28px;margin:0 0 24px}
    section{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:28px; box-shadow:0 1px 0 rgba(0,0,0,.03)}
    .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
    .controls input[type="date"], .search input{border:1px solid var(--line); border-radius:10px; padding:10px 12px}
    .btn{appearance:none; border:none; border-radius:10px; padding:10px 14px; background:var(--brand); color:#fff; cursor:pointer}
    .btn.secondary{background:#475569}
    .btn:disabled{opacity:.6; cursor:not-allowed}
    .badge{display:inline-block; padding:.25rem .5rem; border-radius:999px; background:rgba(30,115,190,.1); color:var(--brand); font-size:12px; font-weight:600}
    .empty{padding:16px; color:var(--muted)}
    table.dataTable thead th{background:#f2f5f8;}
    .loading{color:var(--muted); font-size:14px; margin:6px 0}
    .bar-top{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:10px}
    .search{display:flex; align-items:center; margin-left:auto}
    @media (max-width: 720px){
      h1{font-size:22px}
      section{padding:14px}
      .controls{gap:8px}
      .controls input[type="date"]{flex:1}
      .controls .btn{flex:1}
      .search{width:100%; margin:0}
      .search input{width:100%}
    }
  </style>

  <!-- jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

  <!-- DataTables core -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

  <!-- DataTables Responsive -->
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

  <!-- Moment + plugin para ordenar por fecha/hora -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
  <script src="https://cdn.datatables.net/plug-ins/1.13.8/sorting/datetime-moment.js"></script>
</head>
<body>
  <div class="wrap">
    <input id="user-info" type="hidden"/>
    <input id="role-info" type="hidden"/>

    <h1>Buscar Reservas</h1>

    <section>
      <div class="controls">
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" />
        <button class="btn" id="btn-buscar">Buscar</button>
        <button class="btn secondary" id="btn-hoy" type="button">Hoy</button>
        <button class="btn secondary" id="btn-manana" type="button">Mañana</button>
        <span id="count" class="badge">0 resultados</span>

        <!-- 🔎 Buscador propio enlazado a DataTables -->
        <div class="search" style="margin-left:auto;">
          <input id="q" type="search" placeholder="Buscar en la tabla" />
        </div>
      </div>

      <div id="loading" class="loading" style="display:none;">Cargando reservas...</div>

      <table id="tabla-reservas" class="display nowrap" style="width:100%">
        <thead>
          <tr>
            <th>Fecha Creación</th>  <!-- dd/MM/yyyy HH:mm -->
            <th>Fecha Reserva</th>    <!-- dd/MM/yyyy -->
            <th>Pista</th>
            <th>Hora</th>             <!-- HH:mm - HH:mm -->
            <th>Usuario</th>
            <th>Concepto</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div id="empty" class="empty" hidden>No hay reservas para la fecha seleccionada.</div>
    </section>
  </div>

  <script>
    const API_URL = "https://club-padel-api-12f28391bbbd.herokuapp.com";
    const AUTH_HEADER = 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz';

    // Helpers de fecha
    function toDDMMYYYY(inputDate) {
      if (!inputDate) return "";
      const [y, m, d] = inputDate.split("-");
      return `${d}/${m}/${y}`;
    }
    function hoyISO(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }
    function mananaISO(){
      const d = new Date();
      d.setDate(d.getDate()+1);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // Normaliza filas para la tabla (muestra tal cual; corrige campos)
    function mapRows(list){
      return list.map(r => {
        const creado   = r.fechaHoraCreacion || '-';  // dd/MM/yyyy HH:mm
        const fecha    = r.fechaReserva || '-';       // dd/MM/yyyy
        const inicio   = r.horaInicio || '';
        const fin      = r.horaFin || '';
        const pista    = (r.pista && (r.pista.nombre || r.pista)) || r.pistaNombre || '-';
        const usuario  = (r.usuario && r.usuario.username) || r.userName || '-';
        const concepto = r.concepto || '';
        return [
          creado,
          fecha,
          pista,
          (inicio && fin) ? `${inicio} - ${fin}` : (inicio || '-'),
          usuario,
          concepto
        ];
      });
    }

    // Registrar formatos para ordenación
    function registerDateParsers(){
      $.fn.dataTable.moment('DD/MM/YYYY');
      $.fn.dataTable.moment('DD/MM/YYYY HH:mm');
    }

    // DataTables responsive + orden inicial Hora asc y luego Pista asc
    function initDataTable(){
      return $("#tabla-reservas").DataTable({
        language: { url: "https://cdn.datatables.net/plug-ins/1.13.8/i18n/es-ES.json" },
        pageLength: 10,
        lengthMenu: [10, 25, 50, 100],
        dom: "lrtip",
        responsive: true,
        columnDefs: [
          { responsivePriority: 1, targets: 1 }, // Fecha Reserva
          { responsivePriority: 2, targets: 3 }, // Hora
          { responsivePriority: 3, targets: 2 }, // Pista
          { responsivePriority: 4, targets: 0 }, // Fecha Creación
          { responsivePriority: 5, targets: 4 }, // Usuario
          { responsivePriority: 6, targets: 5 }  // Concepto
        ],
        order: [[3, "asc"], [2, "asc"]],
        createdRow: function(row, data) {
          const hora = data[3] || "";
          const start = (hora.split('-')[0] || '').trim(); // "HH:mm"
          $('td', row).eq(3).attr('data-order', start);
        }
      });
    }

    async function buscar(fechaDDMMYYYY){
      if(!fechaDDMMYYYY){
        alert("Selecciona una fecha.");
        return [];
      }
      try{
        $("#loading").show();
        const res = await fetch(`${API_URL}/reservas/buscar?fecha=${encodeURIComponent(fechaDDMMYYYY)}`, {
          headers:{ 'Authorization': AUTH_HEADER, 'Content-Type':'application/json' }
        });
        if(!res.ok) throw new Error("HTTP "+res.status);
        const data = await res.json();
        return data;
      }catch(e){
        console.error("Error consultando reservas:", e);
        return [];
      }finally{
        $("#loading").hide();
      }
    }

    function fillTable(dt, rows){
      dt.clear();
      dt.rows.add(rows).draw();
    }

    (async function init(){
      registerDateParsers();

      // Instancia DataTable
      const dt = initDataTable();

      // Enlazar buscador propio a DataTables
      document.getElementById('q').addEventListener('input', (e)=>{
        dt.search(e.target.value).draw();
      });

      // Por defecto: hoy
      $("#fecha").val(hoyISO());

      // Botones rápidos
      $("#btn-hoy").on("click", ()=> { $("#fecha").val(hoyISO()); $("#btn-buscar").trigger("click"); });
      $("#btn-manana").on("click", ()=> { $("#fecha").val(mananaISO()); $("#btn-buscar").trigger("click"); });

      // Buscar
      $("#btn-buscar").on("click", async ()=>{
        const fechaDDMMYYYY = toDDMMYYYY($("#fecha").val());
        const data = await buscar(fechaDDMMYYYY);
        const rows = mapRows(data);
        fillTable(dt, rows);
        $("#count").text(`${rows.length} resultados`);
        $("#empty").prop("hidden", rows.length !== 0);
      });

      // (Opcional) ocultar el filtro nativo si aparece
      $("#tabla-reservas_filter").hide();

      // Carga inicial para hoy
      $("#btn-buscar").trigger("click");
    })();
  </script>
</body>
</html>

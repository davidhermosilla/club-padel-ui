
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Resultados por Pareja</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <style>
    .filter-container, #table-container {
      max-width: 100%;
      width: 100%;
      margin: 0 auto;
      padding: 0;
    }

    .filter-container label {
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    .dataTables_wrapper {
      overflow-x: auto;
    }

    @media (max-width: 768px) {
      table.dataTable thead th,
      table.dataTable tbody td {
        white-space: nowrap;
        font-size: 12px;
        padding: 4px;
      }

      .filter-container select {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="filter-container">
    <label for="division-filter">Filtrar por División:</label>
    <select id="division-filter">
      <option value="1ª División">1ª División</option>
      <option value="2ª División">2ª División</option>
      <option value="3ª División">3ª División</option>
      <option value="4ª División">4ª División</option>
      <option value="5ª División">5ª División</option>
      <option value="6ª División">6ª División</option>
      <option value="7ª División">7ª División</option>
      <option value="8ª División">8ª División</option>
      <option value="9ª División">9ª División</option>
      <option value="10ª División">10ª División</option>
      <option value="11ª División">11ª División</option>
      <option value="12ª División">12ª División</option>
    </select>
  </div>
  <div id="table-container" class="dataTables_wrapper"></div>

  <script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSsSc_sZQSKWGvTChV2O-_-kgNL3i-7oz6AzMX7oXVu4eghSgFlScUQ-JrgYTJa1CyhMZUsDAaYVCE4/pub?gid=0&single=true&output=csv&t=" + Date.now();

    async function loadAndProcessSheet() {
      const response = await fetch(sheetURL);
      const data = await response.text();
      const rows = data.split("\n").map(row => row.split(","));

      const headers = rows[0];
      const body = rows.slice(1);

      let tableHTML = '<table id="dynamic-table" class="display"><thead><tr>';
      tableHTML += `<th>${headers[0]}</th>`; // División
      tableHTML += `<th>Pareja 1</th><th>Pareja 2</th>`;
      tableHTML += `<th>Set 1</th><th>Set 2</th><th>Set 3</th>`;
      tableHTML += '</tr></thead><tbody>';

      body.forEach(row => {
        if (row.length >= 9) {
          const division = row[0];
          const pareja1 = `${row[1]} - ${row[2]}`;
          const pareja2 = `${row[3]} - ${row[4]}`;
          const set1 = `${row[5]}-${row[6]}`;
          const set2 = `${row[7]}-${row[8]}`;
          const set3 = row[9] && row[10] ? `${row[9]}-${row[10]}` : '';

          tableHTML += `<tr><td>${division}</td><td>${pareja1}</td><td>${pareja2}</td>`;
          tableHTML += `<td>${set1}</td><td>${set2}</td><td>${set3}</td></tr>`;
        }
      });

      tableHTML += '</tbody></table>';
      document.getElementById("table-container").innerHTML = tableHTML;

      const table = $('#dynamic-table').DataTable({
        paging: true,
        searching: true,
        ordering: true,
        pageLength: 50,
        order: [[0, 'asc']],
        language: {
          url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
        }
      });

      $('#division-filter').on('change', function () {
        const selectedDivision = $(this).val();
        if (selectedDivision) {
          table.column(0).search(`^${selectedDivision}$`, true, false).draw();
        } else {
          table.column(0).search('').draw();
        }
      });

      $('#division-filter').val("1ª División").trigger('change');
    }

    loadAndProcessSheet();
  </script>
</body>
</html>

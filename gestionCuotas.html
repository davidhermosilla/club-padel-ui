<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <title>Gestión de Cuotas</title>

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/fixedheader/3.4.0/css/fixedHeader.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/fixedcolumns/4.3.0/css/fixedColumns.dataTables.min.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    /* Estados de pago */
    .paid { background-color: #d4edda; }
    .not-paid { background-color: #f8d7da; }

    /* Evitar que el tema corte el scroll horizontal del wrapper de DataTables */
    html, body,
    .wp-site-blocks, .site, .site-content, .entry-content, .has-global-padding {
      overflow-x: visible !important;
    }

    /* Que los textos no se rompan en varias líneas dentro de celdas */
    table.dataTable td, table.dataTable th { white-space: nowrap; }

    /* Altura del área scroll vertical del DataTable */
    div.dataTables_scrollBody { max-height: 70vh !important; }

    /* Asegurar fondo y z-index de la columna fija para que se lea bien */
    .dtfc-fixed-left { background: #fff; z-index: 3; }
    .dtfc-fixed-left .dataTables_scrollBody { overflow: hidden !important; }

    /* Botones/Selects un pelín más compactos */
    #cuotas-table select, #cuotas-table button { font-size: 14px; }

    /* Un poco más de ancho a Usuario y Rol para legibilidad */
    th.col-usuario, td.col-usuario { min-width: 240px; }
    th.col-rol, td.col-rol { min-width: 140px; }
  </style>
</head>
<body>

  <h1>Gestión de Cuotas</h1>

  <!-- Filtros -->
  <div class="filters" style="margin-bottom: 12px;">
    <label for="year-select">Año:</label>
    <select id="year-select" style="margin-right:16px;">
      <option value="2025" selected>2025</option>
      <option value="2026">2026</option>
      <option value="2027">2027</option>
      <option value="2028">2028</option>
      <option value="2029">2029</option>
      <option value="2030">2030</option>
      <option value="2031">2031</option>
      <option value="2032">2032</option>
      <option value="2033">2033</option>
      <option value="2034">2034</option>
    </select>

    <label for="role-select">Rol:</label>
    <select id="role-select" style="margin-right:16px;">
      <option value="all" selected>Todos</option>
    </select>

    <label for="user-filter">Usuario:</label>
    <input type="text" id="user-filter" placeholder="Buscar por nombre de usuario" style="width:420px;">
  </div>

  <div class="table-container">
    <table id="cuotas-table" class="display nowrap" style="width:100%; color:#1e73be;">
      <thead>
        <tr>
          <th class="has-text-align-center col-usuario">Usuario</th>
          <th class="has-text-align-center col-rol">Rol</th>
          <th class="has-text-align-center">Enero</th>
          <th class="has-text-align-center">Febrero</th>
          <th class="has-text-align-center">Marzo</th>
          <th class="has-text-align-center">Abril</th>
          <th class="has-text-align-center">Mayo</th>
          <th class="has-text-align-center">Junio</th>
          <th class="has-text-align-center">Julio</th>
          <th class="has-text-align-center">Agosto</th>
          <th class="has-text-align-center">Septiembre</th>
          <th class="has-text-align-center">Octubre</th>
          <th class="has-text-align-center">Noviembre</th>
          <th class="has-text-align-center">Diciembre</th>
        </tr>
      </thead>
      <tbody id="cuotas-table-body"></tbody>
    </table>
  </div>

  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/fixedheader/3.4.0/js/dataTables.fixedHeader.min.js"></script>
  <script src="https://cdn.datatables.net/fixedcolumns/4.3.0/js/dataTables.fixedColumns.min.js"></script>

  <script>
    var api_url = "https://club-padel-api-12f28391bbbd.herokuapp.com";

    const meses = [
      { mes: 'Enero', numero: '01' }, { mes: 'Febrero', numero: '02' },
      { mes: 'Marzo', numero: '03' }, { mes: 'Abril', numero: '04' },
      { mes: 'Mayo', numero: '05' }, { mes: 'Junio', numero: '06' },
      { mes: 'Julio', numero: '07' }, { mes: 'Agosto', numero: '08' },
      { mes: 'Septiembre', numero: '09' }, { mes: 'Octubre', numero: '10' },
      { mes: 'Noviembre', numero: '11' }, { mes: 'Diciembre', numero: '12' }
    ];

    var rolesList = [];
    var dt = null; // instancia DataTable

    function initDataTable() {
      if ($.fn.DataTable.isDataTable('#cuotas-table')) {
        dt.destroy();
        // limpiar estilos insertados por DT al destruir
        $('#cuotas-table').attr('style','width:100%; color:#1e73be;');
      }

      dt = $('#cuotas-table').DataTable({
        scrollX: true,
        scrollY: '70vh',
        scrollCollapse: true,
        paging: false,
        ordering: false,
        searching: true,     // usaremos búsqueda de DataTables para Usuario
        fixedHeader: true,
        fixedColumns: {
          left: 1            // fija la primera columna (Usuario)
        },
        language: {
          url: "https://cdn.datatables.net/plug-ins/1.13.8/i18n/es-ES.json"
        },
        // Anchos sugeridos (puedes ajustar)
        columnDefs: [
          { targets: 0, width: 260, className: 'dt-head-center dt-body-left' },  // Usuario
          { targets: 1, width: 140, className: 'dt-head-center dt-body-left' },  // Rol
          { targets: _range(2, 13), width: 240, className: 'dt-head-center dt-body-left' } // Meses
        ]
      });

      // Conectar filtro de Usuario al DataTable (col 0)
      $('#user-filter').off('keyup').on('keyup', function() {
        dt.column(0).search(this.value).draw();
      });

      // Conectar filtro de Rol al DataTable (col 1)
      $('#role-select').off('change').on('change', function() {
        const value = this.value;
        if (value === 'all') {
          dt.column(1).search('').draw();
        } else {
          // búsqueda exacta del rol
          dt.column(1).search('^' + escapeRegex(value) + '$', true, false).draw();
        }
      });

      // Recalcular tamaños si algo cambia (pestañas, etc.)
      setTimeout(() => dt.columns.adjust().draw(false), 50);
    }

    function escapeRegex(text) {
      return text.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&');
    }

    function _range(a, b) { // helper para targets de columnas
      const arr = [];
      for (let i = a; i <= b; i++) arr.push(i);
      return arr;
    }

    function cargarRoles() {
      $.ajax({
        url: api_url + '/roles',
        type: 'GET',
        contentType: 'application/json',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
        },
        success: function(data) {
          const roleSelect = document.getElementById('role-select');
          roleSelect.innerHTML = '<option value="all" selected>Todos</option>';
          rolesList = [];
          $.each(data, function(index, rol) {
            if (rol.nombre && rol.nombre.toLowerCase() === 'deportista') return;
            rolesList.push(rol.nombre);
            const option = document.createElement('option');
            option.value = rol.nombre;
            option.text = rol.nombre;
            roleSelect.appendChild(option);
          });
          cargarUsuarios(); // primera carga con el año por defecto
        },
        error: function(xhr, status, error) {
          console.error('Error al cargar roles:', error);
        }
      });
    }

    function multiFilter(array, filters) {
      let filterKeys = Object.keys(filters);
      return array.filter((item) => filterKeys.every((key) => (filters[key].indexOf(item[key]) !== -1)));
    }

    function agregarTdMeses(cuotasPagadas, meses, year, row) {
      meses.forEach(mes => {
        const filters = { mesPagoCuota: [mes.numero + '/' + year] };
        const cuotaPagada = multiFilter(cuotasPagadas, filters)[0] || null;
        if (cuotaPagada) {
          const td = document.createElement('td');
          td.classList.add('paid');
          td.dataset.cuotaId = cuotaPagada.id;
          td.dataset.mesanopago = mes.numero + '/' + year;
          td.innerHTML = `Pagado (${cuotaPagada.metodoPago})</br>${cuotaPagada.fechaPago}</br>${cuotaPagada.mesPagoCuota}</br>
                          <button onclick="removePayment(this,'${cuotaPagada.id}')">ELIMINAR PAGO</button>`;
          row.appendChild(td);
        } else {
          const td = document.createElement('td');
          td.classList.add('not-paid');
          td.dataset.mesanopago = mes.numero + '/' + year;
          td.innerHTML = `<select>
                            <option value="CONTADO">Contado</option>
                            <option value="TARJETA">Tarjeta</option>
                          </select>
                          <button onclick="markPaid(this,'${mes.numero}/${year}')">PAGAR</button>`;
          row.appendChild(td);
        }
      });
    }

    function cargarUsuarios() {
      const tbody = document.getElementById('cuotas-table-body');
      tbody.innerHTML = '';
      const year = document.getElementById('year-select').value;
      const rolesParam = rolesList.map(role => encodeURIComponent(role)).join(',');

      $.ajax({
        url: api_url + '/usuarios/buscar-por-roles?roles=' + rolesParam,
        type: 'GET',
        contentType: 'application/json',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
        },
        success: function(data) {
          const frag = document.createDocumentFragment();
          $.each(data, function(index, user) {
            const row = document.createElement('tr');
            row.dataset.rolId = user.rolId;
            row.dataset.role = user.rolName;
            row.dataset.userId = user.userId;
            row.dataset.username = user.username;
            row.dataset.cuotaMensual = user.cuotaMensual;

            // Usuario
            const tdUsername = document.createElement('td');
            tdUsername.className = 'col-usuario';
            tdUsername.textContent = user.username + ' (' + user.cuotaMensual + ')';
            row.appendChild(tdUsername);

            // Rol
            const tdRol = document.createElement('td');
            tdRol.className = 'col-rol';
            tdRol.textContent = user.rolName;
            row.appendChild(tdRol);

            // Meses
            agregarTdMeses(user.cuotas, meses, year, row);

            frag.appendChild(row);
          });
          tbody.appendChild(frag);

          // (Re)inicializar DataTables tras poblar la tabla
          initDataTable();
        },
        error: function(xhr, status, error) {
          console.error('Error al cargar usuarios:', error);
        }
      });
    }

    // Acciones de pago
    function removePayment(button, cuotaId) {
      const td = button.parentElement;
      const tr = td.parentElement;
      var userId = tr.dataset.userId;

      $.ajax({
        url: api_url + '/usuarios/' + userId + '/cuotas/' + cuotaId,
        type: 'DELETE',
        contentType: 'application/json',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
        },
        success: function() {
          td.classList.remove('paid');
          td.classList.add('not-paid');
          delete td.dataset.cuotaId;
          const mesanopago = td.dataset.mesanopago;
          td.innerHTML = `<select>
                            <option value="CONTADO">Contado</option>
                            <option value="TARJETA">Tarjeta</option>
                          </select>
                          <button onclick="markPaid(this,'${mesanopago}')">PAGAR</button>`;
        },
        error: function(xhr, status, error) {
          console.error('Error al eliminar el pago:', error);
        }
      });
    }

    function markPaid(button, mesanopago) {
      const td = button.parentElement;
      const select = td.querySelector('select');
      const metodoPago = select.value;
      const tr = td.parentElement;

      if (!metodoPago) {
        alert("Por favor, selecciona un método de pago.");
        return;
      }

      var currentDate = new Date();
      const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
      const dd = String(currentDate.getDate()).padStart(2, '0');
      const yyyy = currentDate.getFullYear();
      const diaPago = `${dd}/${mm}/${yyyy}`;

      var userId = tr.dataset.userId;
      var cuotaMensual = tr.dataset.cuotaMensual;
      var detalle = 'Pago de cuota mensual de ' + tr.dataset.cuotaMensual + ' euros por el usuario ' + tr.dataset.username;

      $.ajax({
        url: api_url + '/usuarios/' + userId + '/cuotas',
        type: 'PUT',
        contentType: 'application/json',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
        },
        data: JSON.stringify({
          "cantidad": cuotaMensual,
          "detalle": detalle,
          "metodoPago": metodoPago,
          "fechaPago": diaPago,
          "mesPagoCuota": mesanopago
        }),
        success: function(data) {
          td.classList.remove('not-paid');
          td.classList.add('paid');
          td.dataset.cuotaId = data.id;
          td.dataset.mesanopago = mesanopago;
          td.innerHTML = `Pagado (${metodoPago})</br>${diaPago}</br>${mesanopago}</br>
                          <button onclick="removePayment(this,'${data.id}')">ELIMINAR PAGO</button>`;
        },
        error: function(xhr, status, error) {
          console.error('Error al añadir la cuota de pago:', error);
        }
      });
    }

    // Eventos
    $('#year-select').on('change', function() {
      cargarUsuarios();
    });

    // Inicio
    $(function(){
      cargarRoles();
    });
  </script>
</body>
</html>

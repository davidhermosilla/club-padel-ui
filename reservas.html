<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=yes" name="viewport"/>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<title>Reserva de Pistas</title>
<style>
        .calendar-container {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .schedule-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* 5 pistas + 1 columna para las horas */
            gap: 10px;
            width: 100%;
            min-width: 720px;
            max-width: 1500px;
            margin-bottom: 100px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .pista-header, .time-slot,.time-slot-no-user {
            background-color: #007BFF;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
        }
        
        .time-slot-booked,.time-slot-booked-no-user {
            background-color: #d32f2f;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
        }                

        .pista-header {
            background-color: #0056b3;
            font-weight: bold;
        }

        .pista-header-admin {
            background-color: #0056b3;
            font-weight: bold;
        }

        .time-slot-no-user:hover {
            background-color: #007BFF;
        }

        .time-slot:hover {
            background-color: #003f7f;
            cursor: pointer;
        }
        
        .time-slot-booked-no-user:hover {
            background-color: #d32f2f;
        }

        .time-slot-booked:hover {
            background-color: #ba1717;
            cursor: pointer;
        }
		
		.time-slot-past {
			background-color: #d3d3d3; /* gris claro para disponibles pasados */
			color: #888;
			cursor: default;
		}

        .time-slot-booked-past {
            background-color: #a9a9a9; /* gris más oscuro para reservadas pasadas */
            color: #fff;
            cursor: default;
        }

        .time-slot-disabled {
            background-color: #cccccc;
            color: #666666;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
            pointer-events: none;
        }
		
        .time-label {
            background-color: #555;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
        }
        .contenedor-centrado {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 20px;
            /*min-height: 100vh;  Opcional: Para centrar verticalmente en la página */
        }

        .contenedor {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2px; /* Espacio entre cada .contenedor */
        }
        .container {
            display: flex;
        }
        .columna {
            flex: 1; /* Ocupa el mismo espacio cada columna */
            padding: 10px;
            margin: 5px;
        }
        .botones {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px; /* Espacio entre los botones */
        }
    

.schedule-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

.schedule-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
    gap: 6px;
    min-width: 300px;
    max-width: 100%;
    margin-bottom: 100px;
}

.schedule-container > div {
    min-width: 80px;
    font-size: 12px;
    padding: 6px;
}

.time-label {
    min-width: 60px;
    font-size: 11px;
    padding: 6px;
}

@media (max-width: 768px) {
    .schedule-container {
        min-width: 300px;
    }
}

#title-details {
    background-color: #f0f8ff;  /* Fondo azul claro */
    margin-top: 20px;
}

#title-details h2, h3 {
	color: #1e73be;
}

</style>
</head>
<body>
<center><h1>Reserva de Pistas</h1></center>
<div id="modal-reserva-admin" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:9999;">
<div style="background:white; padding:20px; border-radius:10px; text-align:center; min-width:300px;">
<h3>Reservar pista para otro usuario</h3>
<label for="user-select-modal">Selecciona el usuario:</label><br/>
<select id="user-select-modal" style="margin:10px 0;"></select><br/>
<label for="concepto-admin">Concepto:</label><br/>
<input id="concepto-admin" style="width: 90%; margin-bottom: 10px;" type="text"/><br/>
<button id="confirmar-reserva-admin">Confirmar</button>

</div>
<input id="user-info" type="hidden"/>
<input id="role-info" type="hidden"/>
<!-- Contenedor del calendario -->
<div class="calendar-container">
<label for="reservation-date">Selecciona una fecha:</label>
<input id="reservation-date" placeholder="DD/MM/YYYY" type="date"/>
<svg id="refresh-reservas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-label="Refrescar tabla" title="Refrescar tabla" style="cursor:pointer;margin-left:8px;">
  <path d="M17.65 6.35A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24l-2.29 2.29H20V4l-2.35 2.35z"/>
</svg>
</div>

<center>
<div class="schedule-wrapper"><div class="schedule-container" id="schedule-container"></div></div>
<div id="title-details"></div>
<!-- Contenedor de la tabla de pagos y el formulario -->
<div class="container">
<div class="columna" id="payments-container" style="display:none;">
<div id="concepto-reserva-admin" style="display:none; margin-bottom:10px;">

<input id="concepto-text" readonly="" style="width:100%;" type="text"/>
</div>

<button id="socio-propietario-contado-btn" type="submit">Pista Socio P.(2.5€)</button>
<button id="socio-deportista-contado-btn" type="submit">Pista Socio D.(3.5€)</button>
<button id="deportista-contado-btn" type="submit">Pista Deportista(5.5€)</button>
</div>
</div>
<div class="contenedor">
<h3>TARJETA</h3>
<div class="botones">
<button id="socio-propietario-tarjeta-btn" type="submit">Pista Socio P.(2.5€)</button>
<button id="socio-deportista-tarjeta-btn" type="submit">Pista Socio D.(3.5€)</button>
<button id="deportista-tarjeta-btn" type="submit">Pista Deportista(5.5)</button>

</div>
<div class="contenedor">

<div class="botones" style="display: flex; flex-direction: row; gap: 10px;">
<button id="btn-detalle-tienda" type="button">TIENDA</button>
<button id="btn-detalle-bar" type="button">BAR</button>

</div>
<label for="payment-detail">Detalle:</label>

<div class="contenedor">

<br/>
</form>
<br/>
<div id="div-expenses" style="display:none;">

<thead>
<tr>
<th>Cantidad</th>
<th>Método de Pago</th>
<th>Detalle</th>
<th>Acciones</th>
</tr>
</thead>
<tbody>
</tbody>
</table>
<h3 id="payment-total"></h3>
<h3 id="expenses-total"></h3>
<h3 id="paymentandexpenses-total"></h3>

</center>
<script>
// Obtener el método de pago desde radio buttons
function getSelectedPaymentMethod() {
    const radios = document.getElementsByName('payment-method');
    for (const radio of radios) {
        if (radio.checked) {
            return radio.value;
        }
    }
    return null;
}


        var api_url = "https://club-padel-api-12f28391bbbd.herokuapp.com";
        const scheduleContainer = document.getElementById('schedule-container');
        const timeSlots = [
            { time: '16:30 - 18:00'},
            { time: '18:00 - 19:30'},
            { time: '19:30 - 21:00'},
            { time: '21:00 - 22:30'}
        ];                         
                                   
        const weekendSlots = [     
            { time: '09:00 - 10:30'},
            { time: '10:30 - 12:00'},
            { time: '12:00 - 13:30'},
            { time: '16:30 - 18:00'},
            { time: '18:00 - 19:30'},
            { time: '19:30 - 21:00'}
        ];
        
        let datosPista;
        let datosReservas;
        let firstSlotTime = '';
		let usuariosDisponibles = [];

		function cargarUsuariosCombo() {
			$.ajax({
				url: api_url + '/usuarios',
				type: 'GET',
				headers: {
					'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
				},
				success: function(usuarios) {
					usuariosDisponibles = usuarios;
					const select = document.getElementById('user-select-modal');
					select.innerHTML = '';
					usuarios.forEach(usuario => {
						const option = document.createElement('option');
						option.value = usuario.username;
						option.textContent = usuario.username;
						select.appendChild(option);
					});
				},
				error: function(err) {
					console.error('Error al cargar usuarios:', err);
				}
			});
		}

        async function cargarRolUsuario() {
            var username = document.getElementById('user-info').value;
            $.ajax({
                url: api_url+'/usuarios/buscar?username='+username,
                type: 'GET',
                headers: {
                    'Content-Type' : 'application/json',
                    'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
                },
                dataType: 'json',
                success: function(data) {
                    // Limpiar el input hidden de roleName
                    $('#role-info').empty();
                    document.getElementById('role-info').setAttribute('value', data.rolName);
					if (data.rolName === 'administrador') {
						cargarUsuariosCombo();
					}

                    cargaPrincipal();
                },
                error: function(xhr, status, error) {
                    console.error('Error al obtener datos de la API:', error);
                    cargaPrincipal();
                }
            });
        };

        function obtenerReservas(todayDay) { 
            return new Promise((resolve, reject) => {
                $.ajax({
                    url: api_url+'/reservas/buscar?fecha='+todayDay,
                    type: 'GET',
                    headers: {
                        'Content-Type' : 'application/json',
                        'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
                    },
                    dataType: 'json',
                    success: function(data) {
                        resolve(data);                    
                    },
                    error: function(xhr, status, error) {
                        reject(error);
                    }
                });
            });        
        }
        
        function multiFilter(array, filters) {
            let filterKeys = Object.keys(filters);
            return array.filter((item) => filterKeys.every((key) => (filters[key].indexOf(item[key]) !== -1)));
        }
        

        function ocultarPagos() {
            const paymentsContainer = document.getElementById('payments-container');
            paymentsContainer.style.display = 'none';
            const paymentsTable = document.getElementById('payments-table-div');
            paymentsTable.style.display = 'none';
        }

        // Lógica para mostrar pagos y gestionar acciones
		function mostrarPagos(reservaId, pistaId, pistaNombre, slotTime) {
			const paymentsContainer = document.getElementById('payments-container');
			paymentsContainer.style.display = 'block';
			const paymentsTableDiv = document.getElementById('payments-table-div');
			paymentsTableDiv.style.display = 'block';

			// Set hidden fields
			document.getElementById('reservaIdPago').value = reservaId;
			document.getElementById('pistaIdPago').value = pistaId;
			document.getElementById('pistaNombre').value = pistaNombre;
			document.getElementById('slotTimePago').value = slotTime;

			const paymentsTable = document.getElementById('payments-table').querySelector('tbody');
			paymentsTable.innerHTML = '';

			// Limpiar campos de pago
			document.getElementById('payment-amount').value = '';
			document.getElementById('payment-detail').value = '';
			document.getElementById('payment-total').innerHTML = '';
			document.getElementById('expense-amount').value = '';
			document.getElementById('expense-detail').value = '';
			document.getElementById('expenses-total').innerHTML = '';
			document.getElementById('paymentandexpenses-total').innerHTML = '';
			
			const reservaSlot = datosReservas.find(r => r.reservaId == reservaId);
			const reservaUser = reservaSlot ? reservaSlot.userName : '';
			
			// 🔎 Localiza el DIV del slot que tiene el data-telefono
			const selectedDate = new Date(document.getElementById('reservation-date').value);
			const mm = String(selectedDate.getMonth() + 1).padStart(2, '0');
			const dd = String(selectedDate.getDate()).padStart(2, '0');
			const yyyy = selectedDate.getFullYear();
			const diaId = `${dd}/${mm}/${yyyy}`;
			const slotEl = document.getElementById(`${pistaId}_${diaId}_${slotTime}`);
			const telefono = (slotEl && slotEl.dataset && slotEl.dataset.telefono) ? slotEl.dataset.telefono : '';
			
			document.getElementById('title-details').innerHTML = `
				<h2>Pista ${pistaNombre} - ${slotTime}</h2>
				<h3>Reservada por ${reservaUser} con telefono ${telefono}</h3>
			`;


			// Mostrar concepto si eres administrador
			if (document.getElementById('role-info').value === 'administrador') {
				$.ajax({
					url: api_url + '/reservas/' + reservaId,
					type: 'GET',
					headers: {
						'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
					},
					success: function (reservaData) {
						const conceptoDiv = document.getElementById('concepto-reserva-admin');
						const conceptoInput = document.getElementById('concepto-text');
						conceptoDiv.style.display = 'block';
						conceptoInput.value = reservaData.concepto || '';
					},
					error: function (error) {
						console.error('Error al obtener el concepto de la reserva:', error);
					}
				});
			}

			// Obtener pagos
			$.ajax({
				url: api_url + '/reservas/' + reservaId + '/pagos',
				type: 'GET',
				headers: {
					'Content-Type': 'application/json',
					'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
				},
				dataType: 'json',
				success: function (pagosResponse) {
					let total = 0;
					pagosResponse.pagos.forEach(pago => {
						const row = document.createElement('tr');
						row.innerHTML = `
							<td></td>
							<td>${pago.cantidad}</td>
							<td>${pago.metodoPago}</td>
							<td>${pago.detalle || ''}</td>
							<td><button class="delete-payment" data-id="${pago.id}">Eliminar Pago</button></td>
						`;
						const cantidadNumerica = parseFloat(pago.cantidad);
						if (!isNaN(cantidadNumerica)) {
							total += cantidadNumerica;
						}
						paymentsTable.appendChild(row);
					});

					document.getElementById('payment-total').dataset.value = total;
					document.getElementById('payment-total').innerText = 'Total de Pagos: ' + total + '€';

					// Obtener y mostrar gastos
					$.ajax({
						url: api_url + '/reservas/' + reservaId + '/gastos',
						type: 'GET',
						headers: {
							'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
						},
						success: function (gastosResponse) {
							let totalExpenses = 0;
							gastosResponse.gastos.forEach(gasto => {
								const row = document.createElement('tr');
								row.innerHTML = `
									<td></td>
									<td>-${gasto.cantidad}</td>
									<td>${gasto.metodo}</td>
									<td>${gasto.detalle || ''}</td>
									<td><button class="delete-expense" data-id="${gasto.id}">Eliminar Gasto</button></td>
								`;
								const cantidadNumerica = parseFloat(gasto.cantidad);
								if (!isNaN(cantidadNumerica)) {
									totalExpenses -= cantidadNumerica;
								}
								paymentsTable.appendChild(row);
							});

							if (totalExpenses < 0) {
								const totalPagos = parseFloat(document.getElementById('payment-total').dataset.value);
								document.getElementById('expenses-total').innerText = 'Total de Gastos: ' + totalExpenses + '€';
								const resultTotal = totalPagos + totalExpenses;
								document.getElementById('paymentandexpenses-total').innerText = 'Total: ' + resultTotal + '€';
							}

							// Mostrar controles según pista
							if (pistaNombre === 'BAR') {
								document.getElementById('rapids-payments').style.display = 'none';
								document.getElementById('payment-detail').value = '';
								document.getElementById('expense-detail').value = '';
								document.getElementById('div-expenses').style.display = 'block';
							} else {
								document.getElementById('rapids-payments').style.display = 'flex';
								document.getElementById('payment-detail').value = '';
								document.getElementById('expense-detail').value = '';
								document.getElementById('div-expenses').style.display = 'none';
							}
						},
						error: function (xhr, status, error) {
							console.error('Error al obtener gastos:', error);
						}
					});
				},
				error: function (xhr, status, error) {
					console.error('Error al obtener pagos:', error);
				}
			});
		}


        function agregarGasto(reservaId, gasto) {
            $.ajax({
                url: api_url + '/reservas/' + reservaId + '/gastos',
                type: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
                },
                contentType: 'application/json',
                data: JSON.stringify(gasto),
                success: function() {
                    mostrarPagos(reservaId, document.getElementById('pistaIdPago').value, document.getElementById('pistaNombre').value, document.getElementById('slotTimePago').value);
                },
                error: function(xhr, status, error) {
                    console.error('Error al añadir el gasto:', error);
                }
            });
        }

        function agregarPago(reservaId, pago) {
            var pistaId=document.getElementById('pistaIdPago').value;
            var pistaNombre=document.getElementById('pistaNombre').value;
            var slotTime=document.getElementById('slotTimePago').value;
            $.ajax({
                url: api_url+'/reservas/' + reservaId + '/pagos',
                type: 'PUT',
                headers: {
                    'Content-Type' : 'application/json',
                    'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
                },
                contentType: 'application/json',
                data: JSON.stringify(pago),
                success: function() {
                    mostrarPagos(reservaId,pistaId,pistaNombre,slotTime);
                },
                error: function(xhr, status, error) {
                    console.error('Error al añadir el pago:', error);
                }
            });
        }

        function eliminarPago(reservaId, pagoId) {
            var pistaId=document.getElementById('pistaIdPago').value;
            var pistaNombre=document.getElementById('pistaNombre').value;
            var slotTime=document.getElementById('slotTimePago').value;
            $.ajax({
                url: api_url+'/reservas/' + reservaId + '/pagos/' + pagoId,
                type: 'DELETE',
                headers: {
                    'Content-Type' : 'application/json',
                    'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
                },
                success: function() {
                    mostrarPagos(reservaId,pistaId,pistaNombre,slotTime);
                },
                error: function(xhr, status, error) {
                    console.error('Error al eliminar el pago:', error);
                }
            });
        }

        function eliminarGasto(reservaId, gastoId) {
            var pistaId=document.getElementById('pistaIdPago').value;
            var pistaNombre=document.getElementById('pistaNombre').value;
            var slotTime=document.getElementById('slotTimePago').value;
            $.ajax({
                url: api_url+'/reservas/' + reservaId + '/gastos/' + gastoId,
                type: 'DELETE',
                headers: {
                    'Content-Type' : 'application/json',
                    'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
                },
                success: function() {
                    mostrarPagos(reservaId,pistaId,pistaNombre,slotTime);
                },
                error: function(xhr, status, error) {
                    console.error('Error al eliminar el gasto:', error);
                }
            });
        }        

        function cancelarReserva(slot) {
            const skipValidationFlag = document.getElementById('role-info').value === 'administrador';
            $.ajax({
                url: api_url+'/reservas/'+slot.dataset.reserva+'?skipValidation='+skipValidationFlag,
                type: 'DELETE',
                headers: {
                    'Content-Type' : 'application/json',
                    'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
                },
                contentType: 'application/json',
                success: function() {
					slot.className = 'time-slot';
					slot.innerHTML = '<span>Disponible</span></br><span></span>';
                                        slot.dataset.estado = 'Disponible';
                                        const username = slot.dataset.username;
                                        slot.dataset.username = '';

        function limpiarYConfigurarContenedor(numPistas) {
            const divTime = document.createElement('div');

            slots.forEach(slot => {

                scheduleContainer.appendChild(timeLabel);

                datosPista.forEach(pista => {
                    const timeSlot = crearTimeSlot(pista, slot, dia, datosReservas);

            });

            timeSlot.id = `${pista.id}_${dia}_${slot.time}`;

            timeSlot.dataset.pistaNombre = pista.nombre;

            return timeSlot;

				timeSlot.className = esPasado ? 'time-slot-booked-past' : (username !== '' ? 'time-slot-booked' : 'time-slot-booked-no-user');

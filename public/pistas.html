<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<style>
  .modal-body input { margin-bottom: 10px; }
  .bootstrap-scope .modal,
  .bootstrap-scope .modal-dialog,
  .bootstrap-scope .modal-content,
  .bootstrap-scope .modal-header,
  .bootstrap-scope .modal-body,
  .bootstrap-scope .form-group,
  .bootstrap-scope .form-control,
  .bootstrap-scope .btn { }
</style>
</head>
<body>

<div class="wp-block-columns is-layout-flex wp-container-core-columns-is-layout-1 wp-block-columns-is-layout-flex">
  <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:10%"></div>

  <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:80%">
    <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:10%"></div>
    <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:80%">

      <form id="form-nueva-pista">
        <center><h2>Gestión de Pistas</h2></center>
        <label>Nombre</label>
        <input type="text" id="nombre" name="nombre" required>
        <label>Ubicación</label>
        <select id="ubicacion" name="ubicacion" required>
          <option value="INTERNA">Interna</option>
          <option value="EXTERNA">Externa</option>
        </select>
        <label>Orden</label>
        <input type="number" id="orden" name="orden" min="0" step="1" required>
        <br/>
        <button type="submit" id="añadir-pista" class="wpforms" aria-live="assertive">Añadir Nueva Pista</button>
      </form>

      <figure class="wp-block-table is-style-stripes">
        <table id="tabla-pistas" class="has-text-color has-link-color" style="color:#1e73be">
          <thead>
            <tr>
              <th class="has-text-align-center" data-align="center">ID</th>
              <th class="has-text-align-center" data-align="center">Nombre</th>
              <th class="has-text-align-center" data-align="center">Ubicación</th>
              <th class="has-text-align-center" data-align="center">Orden</th>
              <th class="has-text-align-center" data-align="center">Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <figcaption class="wp-element-caption">Tabla de pistas</figcaption>
      </figure>
    </div>
    <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:10%"></div>
  </div>

  <!-- Modal para editar pista -->
  <div class="bootstrap-scope">
    <div class="modal fade" id="editModal" tabindex="-1" role="dialog" aria-labelledby="editModalLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editModalLabel">Editar Pista</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <form id="editPistaForm">
              <input type="hidden" id="pistaId">
              <div class="form-group">
                <label for="pistaName">Nombre</label>
                <input type="text" class="form-control" id="pistaName" placeholder="Nombre de la pista">
              </div>
              <div class="form-group">
                <label for="pistaLocation">Ubicación</label>
                <input type="text" class="form-control" id="pistaLocation" placeholder="Ubicación de la pista">
              </div>
              <div class="form-group">
                <label for="pistaOrden">Orden</label>
                <input type="number" class="form-control" id="pistaOrden" min="0" step="1">
              </div>
              <button id="save-pista-id" type="button">Guardar cambios</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var api_url = "https://club-padel-api-12f28391bbbd.herokuapp.com";

$(document).ready(function(){
  // Alta
  $('#form-nueva-pista').submit(function(event) {
    event.preventDefault();
    var nombre = $('#nombre').val();
    var ubicacion = $('#ubicacion').val();
    var orden = parseInt($('#orden').val(), 10);

    $.ajax({
      url: api_url + '/pistas',
      type: 'POST',
      contentType: 'application/json',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
      },
      data: JSON.stringify({ nombre: nombre, ubicacion: ubicacion, orden: orden }),
      success: function(){ cargarPistas(); },
      error: function(xhr){ console.error('Error al añadir una nueva pista:', xhr); }
    });
  });

  // Listado
  function cargarPistas() {
    $.ajax({
      url: api_url + '/pistas',
      type: 'GET',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
      },
      dataType: 'json',
      success: function(data) {
        // Ordenar por campo orden asc (BAR al final) solo para la vista
        data = data.sort((a,b)=>{
          if (a.nombre === 'BAR') return 1;
          if (b.nombre === 'BAR') return -1;
          const ao = Number.isFinite(parseInt(a.orden,10)) ? parseInt(a.orden,10) : 9999;
          const bo = Number.isFinite(parseInt(b.orden,10)) ? parseInt(b.orden,10) : 9999;
          if (ao !== bo) return ao - bo;
          return (a.nombre||'').localeCompare(b.nombre||'');
        });

        $('#tabla-pistas tbody').empty();
        $.each(data, function(_, pista) {
          $('#tabla-pistas tbody').append(`
            <tr class="has-text-align-center" data-align="center">
              <td>${pista.id}</td>
              <td>${pista.nombre}</td>
              <td>${pista.ubicacion}</td>
              <td>${(pista.orden ?? '')}</td>
              <td>
                <button class="editar-pista" data-toggle="modal" data-target="#editModal"
                        data-id="${pista.id}" data-nombre="${pista.nombre}"
                        data-ubicacion="${pista.ubicacion}" data-orden="${pista.orden ?? ''}">Editar</button>
                <button class="eliminar-pista" data-id="${pista.id}">Eliminar</button>
              </td>
            </tr>
          `);
        });
      },
      error: function(xhr){ console.error('Error al obtener datos de la API:', xhr); }
    });
  }

  // Eliminar
  $('#tabla-pistas').on('click', '.eliminar-pista', function() {
    var pistaId = $(this).data('id');
    $.ajax({
      url: api_url + '/pistas/' + pistaId,
      type: 'DELETE',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
      },
      success: function(){ cargarPistas(); },
      error: function(xhr){ console.error('Error al eliminar la pista:', xhr); }
    });
  });

  function loadPistaData(pistaId, pistaNombre, pistaUbicacion, pistaOrden) {
    $('#pistaId').val(pistaId);
    $('#pistaName').val(pistaNombre);
    $('#pistaLocation').val(pistaUbicacion);
    $('#pistaOrden').val(pistaOrden ?? '');
  }

  function savePista() {
    const pistaId = $('#pistaId').val();
    const name = $('#pistaName').val();
    const location = $('#pistaLocation').val();
    const orden = parseInt($('#pistaOrden').val(), 10);

    $.ajax({
      url: api_url + '/pistas/' + pistaId,
      type: 'PUT',
      contentType: 'application/json',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
      },
      data: JSON.stringify({ nombre: name, ubicacion: location, orden: orden }),
      success: function(){ cargarPistas(); },
      error: function(xhr){ console.error('Error al actualizar la pista:', xhr); }
    });

    $('#editModal').modal('hide');
  }

  $('#save-pista-id').on('click', savePista);

  $('#tabla-pistas').on('click', '.editar-pista', function() {
    const pistaId = $(this).data('id');
    const pistaNombre = $(this).data('nombre');
    const pistaUbicacion = $(this).data('ubicacion');
    const pistaOrden = $(this).data('orden');
    loadPistaData(pistaId, pistaNombre, pistaUbicacion, pistaOrden);
  });

  cargarPistas();
});
</script>
</body>
</html>

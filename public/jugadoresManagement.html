<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- jQuery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<!-- DataTables -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<title>Gestión de Jugadores</title>
</head>
<body>

<div class="wp-block-columns is-layout-flex wp-container-core-columns-is-layout-1 wp-block-columns-is-layout-flex">
  <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:10%"></div>

  <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:80%">
    <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:10%"></div>
    <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:80%">

      <!-- Formulario: nuevo jugador (solo nombre) -->
      <form id="form-nuevo-jugador">
        <center><h2>Gestión de Jugadores</h2></center>
        <h3><label for="nombreJugador">Nombre del Jugador</label></h3><br>
        <input type="text" id="nombreJugador" name="nombreJugador" required><br>
        <button type="submit" id="añadir-jugador" class="wpforms" aria-live="assertive">Añadir Nuevo Jugador</button>
      </form>

      <!-- Cargar desde archivo (.txt): una línea por jugador, solo el nombre -->
      <form id="form-cargar-archivo" style="margin-top:20px;">
        <h3>Cargar jugadores desde archivo (.txt)</h3><br>
        <input type="file" id="archivoJugadores" accept=".txt"><br>
        <button type="button" id="cargar-archivo" class="wpforms" aria-live="assertive">Cargar Jugadores</button>
      </form>

      <!-- Formulario: editar jugador (solo nombre) -->
      <form id="form-editar-jugador" style="display:none; margin-top:20px;">
        <h2>Editar Jugador</h2>
        <input type="hidden" id="editJugadorId" name="editJugadorId">
        <label for="editNombreJugador">Nombre del Jugador</label>
        <input type="text" id="editNombreJugador" name="editNombreJugador" required>
        <button type="submit" id="guardar-cambios-jugador" class="wpforms" aria-live="assertive">Guardar Cambios</button>
        <button type="button" id="cancelar-edicion" class="wpforms">Cancelar</button>
      </form>

      <!-- Tabla: ID, Nombre, Acciones -->
      <figure class="wp-block-table is-style-stripes" style="margin-top:20px;">
        <table id="tabla-jugadores" class="has-text-color has-link-color" style="color:#1e73be; width:100%;">
          <thead>
            <tr>
              <th class="has-text-align-center" data-align="center">ID</th>
              <th class="has-text-align-center" data-align="center">Nombre</th>
              <th class="has-text-align-center" data-align="center">Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <figcaption class="wp-element-caption">Tabla de jugadores</figcaption>
      </figure>

    </div>
    <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:10%"></div>
  </div>
</div>

<script>
var api_url = "https://club-padel-api-12f28391bbbd.herokuapp.com";

$(document).ready(function(){
  // DataTable en español
  var tablaJugadores = $('#tabla-jugadores').DataTable({
    language: { url: 'https://cdn.datatables.net/plug-ins/1.13.4/i18n/es-ES.json' }
  });

  // Alta de jugador (solo nombre)
  $('#form-nuevo-jugador').on('submit', function(e) {
    e.preventDefault();
    var nombre = $('#nombreJugador').val().trim();
    if (!nombre) return;

    $.ajax({
      url: api_url + '/jugadores',
      type: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
      },
      contentType: 'application/json',
      data: JSON.stringify({ nombre: nombre }),
      success: function() {
        $('#nombreJugador').val('');
        cargarJugadores();
      },
      error: function(xhr) {
        console.error('Error al añadir jugador:', xhr.responseText || xhr.statusText);
        alert('No se pudo añadir el jugador.');
      }
    });
  });

  // Editar jugador (solo nombre)
  $('#form-editar-jugador').on('submit', function(e) {
    e.preventDefault();
    var jugadorId = $('#editJugadorId').val();
    var nombre = $('#editNombreJugador').val().trim();
    if (!jugadorId || !nombre) return;

    $.ajax({
      url: api_url + '/jugadores/' + jugadorId,
      type: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
      },
      contentType: 'application/json',
      data: JSON.stringify({ nombre: nombre }),
      success: function() {
        $('#form-editar-jugador').hide();
        $('#form-nuevo-jugador').show();
        cargarJugadores();
      },
      error: function(xhr) {
        console.error('Error al actualizar jugador:', xhr.responseText || xhr.statusText);
        alert('No se pudo actualizar el jugador.');
      }
    });
  });

  // Cancelar edición
  $('#cancelar-edicion').on('click', function() {
    $('#form-editar-jugador').hide();
    $('#form-nuevo-jugador').show();
  });

  // Cargar jugadores desde .txt: una línea por jugador (solo nombre).
  // Si la línea contiene "Nombre|..." se usará solo la primera parte.
  $('#cargar-archivo').on('click', function() {
    var file = $('#archivoJugadores')[0].files[0];
    if (!file) {
      alert('Seleccione un fichero .txt');
      return;
    }

    var reader = new FileReader();
    reader.onload = function(e) {
      var lines = e.target.result.split(/\r?\n/);
      var requests = [];

      $.each(lines, function(_, line){
        var raw = line.trim();
        if (!raw) return;

        // Permite líneas "Nombre" o "Nombre|cualquiercosa"
        var nombre = raw.split('|')[0].trim();
        if (!nombre) return;

        requests.push($.ajax({
          url: api_url + '/jugadores',
          type: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
          },
          contentType: 'application/json',
          data: JSON.stringify({ nombre: nombre })
        }));
      });

      if (requests.length === 0) {
        $('#archivoJugadores').val('');
        cargarJugadores();
      } else {
        $.when.apply($, requests).always(function(){
          $('#archivoJugadores').val('');
          cargarJugadores();
        });
      }
    };

    reader.readAsText(file);
  });

  // Cargar y pintar jugadores
  function cargarJugadores() {
    $.ajax({
      url: api_url + '/jugadores',
      type: 'GET',
      dataType: 'json',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
      },
      success: function(data) {
        tablaJugadores.clear();
        $.each(data, function(_, jugador) {
          tablaJugadores.row.add([
            jugador.jugadorId,
            jugador.nombre,
            `<button class="editar-jugador" data-id="${jugador.jugadorId}" data-nombre="${jugador.nombre}">Editar</button>
             <button class="eliminar-jugador" data-id="${jugador.jugadorId}">Eliminar</button>`
          ]);
        });
        tablaJugadores.draw();
      },
      error: function(xhr) {
        console.error('Error al obtener jugadores:', xhr.responseText || xhr.statusText);
        alert('No se pudieron cargar los jugadores.');
      }
    });
  }

  // Click en Editar
  $('#tabla-jugadores').on('click', '.editar-jugador', function() {
    var jugadorId = $(this).data('id');
    var nombre = $(this).data('nombre');

    $('#editJugadorId').val(jugadorId);
    $('#editNombreJugador').val(nombre);

    $('#form-nuevo-jugador').hide();
    $('#form-editar-jugador').show();
  });

  // Click en Eliminar
  $('#tabla-jugadores').on('click', '.eliminar-jugador', function() {
    var jugadorId = $(this).data('id');
    if (!confirm('¿Eliminar el jugador con ID ' + jugadorId + '?')) return;

    $.ajax({
      url: api_url + '/jugadores/' + jugadorId,
      type: 'DELETE',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
      },
      success: function() { cargarJugadores(); },
      error: function(xhr) {
        console.error('Error al eliminar jugador:', xhr.responseText || xhr.statusText);
        alert('El borrado ha fallado. Contacte con el administrador de la aplicación.');
      }
    });
  });

  // Inicial
  cargarJugadores();
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- jQuery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<!-- DataTables -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<title>Gestión de Días Extraordinarios</title>
</head>
<body>

<div class="wp-block-columns is-layout-flex wp-container-core-columns-is-layout-1 wp-block-columns-is-layout-flex">
  <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:10%"></div>

  <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:80%">
    <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:10%"></div>
    <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:80%">

      <!-- Formulario: nuevo día extraordinario -->
      <form id="form-nuevo-dia">
        <center><h2>Gestión de Días Extraordinarios</h2></center>
        <h3><label for="fechaDia">Fecha (DD/MM/YYYY)</label></h3><br>
        <input type="text" id="fechaDia" name="fechaDia" placeholder="25/12/2026" required><br>
        <h3><label for="descripcionDia">Descripción</label></h3><br>
        <input type="text" id="descripcionDia" name="descripcionDia" placeholder="Navidad" required><br>
        <button type="submit" id="añadir-dia" class="wpforms" aria-live="assertive">Añadir Día Extraordinario</button>
      </form>

      <!-- Formulario: editar día extraordinario -->
      <form id="form-editar-dia" style="display:none; margin-top:20px;">
        <h2>Editar Día Extraordinario</h2>
        <input type="hidden" id="editDiaId" name="editDiaId">
        <label for="editFechaDia">Fecha (DD/MM/YYYY)</label>
        <input type="text" id="editFechaDia" name="editFechaDia" required>
        <label for="editDescripcionDia">Descripción</label>
        <input type="text" id="editDescripcionDia" name="editDescripcionDia" required>
        <button type="submit" id="guardar-cambios-dia" class="wpforms" aria-live="assertive">Guardar Cambios</button>
        <button type="button" id="cancelar-edicion" class="wpforms">Cancelar</button>
      </form>

      <!-- Tabla: ID, Fecha, Descripción, Acciones -->
      <figure class="wp-block-table is-style-stripes" style="margin-top:20px;">
        <table id="tabla-dias" class="has-text-color has-link-color" style="color:#1e73be; width:100%;">
          <thead>
            <tr>
              <th class="has-text-align-center" data-align="center">ID</th>
              <th class="has-text-align-center" data-align="center">Fecha</th>
              <th class="has-text-align-center" data-align="center">Descripción</th>
              <th class="has-text-align-center" data-align="center">Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <figcaption class="wp-element-caption">Tabla de días extraordinarios</figcaption>
      </figure>

    </div>
    <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:10%"></div>
  </div>
</div>

<script>
var api_url = "https://club-padel-api-12f28391bbbd.herokuapp.com";

$(document).ready(function(){
  // DataTable en español
  var tablaDias = $('#tabla-dias').DataTable({
    language: { url: 'https://cdn.datatables.net/plug-ins/1.13.4/i18n/es-ES.json' },
    order: [[1, 'asc']] // Ordenar por fecha
  });

  // Validar formato de fecha DD/MM/YYYY
  function validarFecha(fecha) {
    var regex = /^(\d{2})\/(\d{2})\/(\d{4})$/;
    if (!regex.test(fecha)) {
      return false;
    }
    var partes = fecha.split('/');
    var dia = parseInt(partes[0], 10);
    var mes = parseInt(partes[1], 10);
    var año = parseInt(partes[2], 10);
    
    if (mes < 1 || mes > 12) return false;
    if (dia < 1 || dia > 31) return false;
    
    return true;
  }

  // Alta de día extraordinario
  $('#form-nuevo-dia').on('submit', function(e) {
    e.preventDefault();
    var fecha = $('#fechaDia').val().trim();
    var descripcion = $('#descripcionDia').val().trim();
    
    if (!fecha || !descripcion) {
      alert('Por favor, complete todos los campos.');
      return;
    }

    if (!validarFecha(fecha)) {
      alert('Formato de fecha inválido. Use DD/MM/YYYY (ejemplo: 25/12/2026)');
      return;
    }

    $.ajax({
      url: api_url + '/dias-extraordinarios',
      type: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
      },
      contentType: 'application/json',
      data: JSON.stringify({ 
        fecha: fecha,
        descripcion: descripcion 
      }),
      success: function() {
        $('#fechaDia').val('');
        $('#descripcionDia').val('');
        cargarDias();
        alert('Día extraordinario añadido correctamente.');
      },
      error: function(xhr) {
        console.error('Error al añadir día extraordinario:', xhr.responseText || xhr.statusText);
        alert('No se pudo añadir el día extraordinario. ' + (xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : ''));
      }
    });
  });

  // Editar día extraordinario
  $('#form-editar-dia').on('submit', function(e) {
    e.preventDefault();
    var diaId = $('#editDiaId').val();
    var fecha = $('#editFechaDia').val().trim();
    var descripcion = $('#editDescripcionDia').val().trim();
    
    if (!diaId || !fecha || !descripcion) {
      alert('Por favor, complete todos los campos.');
      return;
    }

    if (!validarFecha(fecha)) {
      alert('Formato de fecha inválido. Use DD/MM/YYYY (ejemplo: 25/12/2026)');
      return;
    }

    $.ajax({
      url: api_url + '/dias-extraordinarios/' + diaId,
      type: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
      },
      contentType: 'application/json',
      data: JSON.stringify({ 
        fecha: fecha,
        descripcion: descripcion 
      }),
      success: function() {
        $('#form-editar-dia').hide();
        $('#form-nuevo-dia').show();
        cargarDias();
        alert('Día extraordinario actualizado correctamente.');
      },
      error: function(xhr) {
        console.error('Error al actualizar día extraordinario:', xhr.responseText || xhr.statusText);
        alert('No se pudo actualizar el día extraordinario. ' + (xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : ''));
      }
    });
  });

  // Cancelar edición
  $('#cancelar-edicion').on('click', function() {
    $('#form-editar-dia').hide();
    $('#form-nuevo-dia').show();
  });

  // Cargar y pintar días extraordinarios
  function cargarDias() {
    $.ajax({
      url: api_url + '/dias-extraordinarios',
      type: 'GET',
      dataType: 'json',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
      },
      success: function(data) {
        tablaDias.clear();
        $.each(data, function(_, dia) {
          tablaDias.row.add([
            dia.id,
            dia.fecha,
            dia.descripcion,
            `<button class="editar-dia" data-id="${dia.id}" data-fecha="${dia.fecha}" data-descripcion="${dia.descripcion}">Editar</button>
             <button class="eliminar-dia" data-id="${dia.id}">Eliminar</button>`
          ]);
        });
        tablaDias.draw();
      },
      error: function(xhr) {
        console.error('Error al obtener días extraordinarios:', xhr.responseText || xhr.statusText);
        alert('No se pudieron cargar los días extraordinarios.');
      }
    });
  }

  // Click en Editar
  $('#tabla-dias').on('click', '.editar-dia', function() {
    var diaId = $(this).data('id');
    var fecha = $(this).data('fecha');
    var descripcion = $(this).data('descripcion');

    $('#editDiaId').val(diaId);
    $('#editFechaDia').val(fecha);
    $('#editDescripcionDia').val(descripcion);

    $('#form-nuevo-dia').hide();
    $('#form-editar-dia').show();
  });

  // Click en Eliminar
  $('#tabla-dias').on('click', '.eliminar-dia', function() {
    var diaId = $(this).data('id');
    if (!confirm('¿Eliminar el día extraordinario con ID ' + diaId + '?')) return;

    $.ajax({
      url: api_url + '/dias-extraordinarios/' + diaId,
      type: 'DELETE',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
      },
      success: function() { 
        cargarDias(); 
        alert('Día extraordinario eliminado correctamente.');
      },
      error: function(xhr) {
        console.error('Error al eliminar día extraordinario:', xhr.responseText || xhr.statusText);
        alert('El borrado ha fallado. ' + (xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : 'Contacte con el administrador de la aplicación.'));
      }
    });
  });

  // Cargar inicial
  cargarDias();
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagos de Clases</title>

  <style>
    *{box-sizing:border-box}
    body{margin:0; font-family:ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial; background:#f7f9fc; color:#0f172a}
    .club-scope{--card:#fff; --muted:#64748b; --brand:#1e73be; --line:#e5e7eb; --ok:#15803d; --warn:#b45309; --danger:#b91c1c; --radius:12px}
    .club-wrap{max-width:1180px; margin:32px auto; padding:0 16px}
    h1{font-size:28px; margin:0 0 20px}
    .toolbar, .player-block{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 1px 0 rgba(0,0,0,.03)}
    .toolbar{display:flex; align-items:flex-end; gap:14px; padding:16px; margin-bottom:18px; flex-wrap:wrap}
    .field{display:flex; flex-direction:column; gap:6px; min-width:240px}
    .field label{font-size:13px; color:var(--muted)}
    input, select{border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; outline:none; background:#fff}
    input:focus, select:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(30,115,190,.15)}
    .status-text{color:var(--muted); font-size:14px}
    .player-block{padding:16px; margin-bottom:18px}
    .player-head{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap}
    .player-head h2{font-size:18px; margin:0}
    .badge{display:inline-block; padding:.25rem .55rem; border-radius:999px; background:rgba(30,115,190,.1); color:var(--brand); font-size:12px; font-weight:700}
    .table-wrap{width:100%; overflow-x:auto}
    table{width:100%; border-collapse:collapse; min-width:620px}
    th, td{padding:10px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle}
    th{background:#f2f5f8; color:#334155; font-size:13px}
    td{font-size:14px}
    .estado{display:inline-block; min-width:92px; padding:5px 9px; border-radius:999px; font-size:12px; font-weight:700; text-align:center}
    .estado-pendiente{background:#fff7ed; color:var(--warn)}
    .estado-pagado{background:#dcfce7; color:var(--ok)}
    .actions{display:flex; gap:8px; flex-wrap:wrap}
    button{border:0; border-radius:8px; padding:8px 10px; font-weight:700; cursor:pointer; font-size:13px}
    button:disabled{opacity:.6; cursor:not-allowed}
    .btn-cash{background:#16a34a; color:#fff}
    .btn-card{background:#2563eb; color:#fff}
    .btn-pending{background:#f59e0b; color:#111827}
    .pagination{display:flex; justify-content:flex-end; align-items:center; gap:10px; padding-top:12px}
    .pagination button{background:#e2e8f0; color:#0f172a}
    .empty, .blocked{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:18px; color:var(--muted)}
    .blocked strong{color:var(--danger)}
    .loading{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(255,255,255,.75); z-index:9999}
    .spinner{width:44px; height:44px; border:4px solid #dbeafe; border-top-color:var(--brand); border-radius:50%; animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width:720px){
      .club-wrap{padding:0 10px; margin:20px auto}
      h1{font-size:22px}
      .toolbar, .player-block{padding:14px}
      .field{width:100%; min-width:0}
      .status-text{width:100%}
      .pagination{justify-content:space-between}
    }
  </style>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
  <div class="club-scope">
    <div class="club-wrap">
      <input id="user-info" type="hidden" />
      <input id="role-info" type="hidden" />

      <h1>Pagos de Clases</h1>

      <div id="loading" class="loading"><div class="spinner"></div></div>

      <div id="blocked" class="blocked" hidden>
        <strong>Acceso restringido.</strong> Esta pantalla solo esta disponible para usuarios con rol entrenador.
      </div>

      <main id="app" hidden>
        <div class="toolbar">
          <div class="field">
            <label for="jugador-filter">Jugador</label>
            <input id="jugador-filter" list="jugadores-options" type="search" placeholder="Todos los jugadores" />
            <datalist id="jugadores-options"></datalist>
          </div>
          <div class="status-text" id="resumen"></div>
        </div>

        <div id="players-container"></div>
        <div id="empty" class="empty" hidden>No hay clases para mostrar con el filtro seleccionado.</div>
      </main>
    </div>
  </div>

  <script>
    const API_URL = "https://club-padel-api-12f28391bbbd.herokuapp.com";
    const AUTH_HEADER = "Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz";
    const PAGE_SIZE = 4;

    const state = {
      username: "",
      role: "",
      groups: [],
      filter: "",
      pageByPlayer: new Map(),
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function waitForUserInfo({ timeout = 10000, pollMs = 200 } = {}) {
      return new Promise((resolve) => {
        const el = document.getElementById("user-info");
        const done = (val) => { cleanup(); resolve(val || null); };
        if (el && el.value) return resolve(el.value);
        let toId, pollId, obs;
        const check = () => { if (el && el.value) done(el.value); };
        const onUserReady = () => check();
        const cleanup = () => {
          if (toId) clearTimeout(toId);
          if (pollId) clearInterval(pollId);
          if (obs) obs.disconnect();
          el && el.removeEventListener("userReady", onUserReady);
        };
        el && el.addEventListener("userReady", onUserReady);
        if (el) {
          obs = new MutationObserver(check);
          obs.observe(el, { attributes: true, attributeFilter: ["value"] });
        }
        pollId = setInterval(check, pollMs);
        toId = setTimeout(() => done(null), timeout);
      });
    }

    async function cargarContextoUsuario(usernameSesion) {
      const username = String(usernameSesion || "").trim();
      if (!username) return null;
      const res = await fetch(API_URL + "/usuarios/buscar?username=" + encodeURIComponent(username), {
        headers: { Authorization: AUTH_HEADER, "Content-Type": "application/json" },
      });
      if (!res.ok) throw new Error("No se pudo cargar el usuario.");
      const data = await res.json();
      const role = data?.rolName || data?.rol?.nombre || "";
      document.getElementById("role-info").setAttribute("value", role);
      return { username, role };
    }

    function showLoading(show) {
      document.getElementById("loading").style.display = show ? "flex" : "none";
    }

    function formatFecha(fecha) {
      const f = String(fecha || "").trim();
      const match = f.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (match) return `${match[3]}/${match[2]}/${match[1]}`;
      return f || "-";
    }

    function formatHora(hora) {
      const h = String(hora || "").trim();
      const match = h.match(/^(\d{1,2}):(\d{2})/);
      return match ? `${String(parseInt(match[1], 10)).padStart(2, "0")}:${match[2]}` : h;
    }

    function parseFechaHora(fecha, hora) {
      const f = String(fecha || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
      const h = String(hora || "00:00").match(/^(\d{1,2}):(\d{2})/);
      if (!f) return 0;
      return new Date(
        parseInt(f[1], 10),
        parseInt(f[2], 10) - 1,
        parseInt(f[3], 10),
        h ? parseInt(h[1], 10) : 0,
        h ? parseInt(h[2], 10) : 0,
      ).getTime();
    }

    function normalizarClases(clases) {
      const map = new Map();
      (Array.isArray(clases) ? clases : []).forEach((clase) => {
        const jugadores = Array.isArray(clase?.jugadores) ? clase.jugadores : [];
        jugadores.forEach((jugador) => {
          const jugadorId = jugador?.jugadorId ?? jugador?.id ?? jugador?.usuarioId ?? jugador?.userId ?? "";
          const username = jugador?.username ?? jugador?.userName ?? jugador?.usuario?.username ?? "-";
          if (!jugadorId && username === "-") return;

          const key = String(jugadorId || username);
          if (!map.has(key)) {
            map.set(key, { jugadorId, username, items: [] });
          }

          map.get(key).items.push({
            claseId: clase?.id ?? clase?.claseId ?? "",
            jugadorId,
            username,
            fechaRaw: clase?.fecha || "",
            horaRaw: clase?.horaInicio || "",
            fechaFmt: formatFecha(clase?.fecha),
            horaFmt: formatHora(clase?.horaInicio),
            estado: jugador?.pagoEstado || "PENDIENTE",
            sortMs: parseFechaHora(clase?.fecha, clase?.horaInicio),
          });
        });
      });

      return Array.from(map.values())
        .map((group) => ({
          ...group,
          items: group.items.sort((a, b) => b.sortMs - a.sortMs),
        }))
        .sort((a, b) => String(a.username).localeCompare(String(b.username), "es", { sensitivity: "base" }));
    }

    async function cargarClases() {
      const res = await fetch(API_URL + "/clases?entrenador=" + encodeURIComponent(state.username), {
        headers: { Authorization: AUTH_HEADER, "Content-Type": "application/json" },
      });
      if (!res.ok) throw new Error("No se pudieron cargar las clases.");
      const data = await res.json();
      state.groups = normalizarClases(data);
      state.pageByPlayer.clear();
      rellenarFiltroJugadores();
      render();
    }

    function rellenarFiltroJugadores() {
      const dataList = document.getElementById("jugadores-options");
      dataList.innerHTML = "";
      state.groups.forEach((group) => {
        const opt = document.createElement("option");
        opt.value = group.username;
        dataList.appendChild(opt);
      });
    }

    function filteredGroups() {
      const filter = state.filter.trim().toLowerCase();
      if (!filter) return state.groups;
      return state.groups.filter((group) => String(group.username).toLowerCase().includes(filter));
    }

    function estadoClass(estado) {
      return String(estado || "").toUpperCase() === "PENDIENTE" ? "estado-pendiente" : "estado-pagado";
    }

    function renderActions(item) {
      const estado = String(item.estado || "").toUpperCase();
      if (estado === "PENDIENTE") {
        return `
          <button type="button" class="btn-cash" data-action="pagado" data-metodo="CONTADO" data-clase-id="${escapeHtml(item.claseId)}" data-jugador-id="${escapeHtml(item.jugadorId)}">Pagar Efectivo</button>
          <button type="button" class="btn-card" data-action="pagado" data-metodo="TARJETA" data-clase-id="${escapeHtml(item.claseId)}" data-jugador-id="${escapeHtml(item.jugadorId)}">Pagar Tarjeta</button>
        `;
      }
      return `<button type="button" class="btn-pending" data-action="pendiente" data-clase-id="${escapeHtml(item.claseId)}" data-jugador-id="${escapeHtml(item.jugadorId)}">Pasar a Pendiente</button>`;
    }

    function render() {
      const container = document.getElementById("players-container");
      const groups = filteredGroups();
      const totalClases = groups.reduce((total, group) => total + group.items.length, 0);

      document.getElementById("resumen").textContent = `${groups.length} jugadores - ${totalClases} clases`;
      document.getElementById("empty").hidden = groups.length !== 0;
      container.innerHTML = "";

      groups.forEach((group) => {
        const page = state.pageByPlayer.get(String(group.jugadorId || group.username)) || 1;
        const totalPages = Math.max(1, Math.ceil(group.items.length / PAGE_SIZE));
        const safePage = Math.min(page, totalPages);
        state.pageByPlayer.set(String(group.jugadorId || group.username), safePage);
        const start = (safePage - 1) * PAGE_SIZE;
        const rows = group.items.slice(start, start + PAGE_SIZE);

        const block = document.createElement("section");
        block.className = "player-block";
        block.innerHTML = `
          <div class="player-head">
            <h2>${escapeHtml(group.username)}</h2>
            <span class="badge">${group.items.length} clases</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map((item) => `
                  <tr>
                    <td>${escapeHtml(item.fechaFmt)} ${escapeHtml(item.horaFmt)}</td>
                    <td><span class="estado ${estadoClass(item.estado)}">${escapeHtml(item.estado)}</span></td>
                    <td><div class="actions">${renderActions(item)}</div></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
          <div class="pagination">
            <button type="button" data-page-action="prev" data-player-key="${escapeHtml(group.jugadorId || group.username)}" ${safePage <= 1 ? "disabled" : ""}>Anterior</button>
            <span>Pagina ${safePage} de ${totalPages}</span>
            <button type="button" data-page-action="next" data-player-key="${escapeHtml(group.jugadorId || group.username)}" ${safePage >= totalPages ? "disabled" : ""}>Siguiente</button>
          </div>
        `;
        container.appendChild(block);
      });
    }

    function actualizarEstadoLocal(claseId, jugadorId, estado) {
      state.groups.forEach((group) => {
        group.items.forEach((item) => {
          if (String(item.claseId) === String(claseId) && String(item.jugadorId) === String(jugadorId)) {
            item.estado = estado;
          }
        });
      });
    }

    async function cambiarPago({ action, metodo, claseId, jugadorId }) {
      const suffix = action === "pagado"
        ? `/pagado?metodo=${encodeURIComponent(metodo)}`
        : "/pendiente";
      const res = await fetch(`${API_URL}/clases/${encodeURIComponent(claseId)}/jugadores/${encodeURIComponent(jugadorId)}${suffix}`, {
        method: "PUT",
        headers: { Authorization: AUTH_HEADER, "Content-Type": "application/json" },
      });
      if (!res.ok) throw new Error("No se pudo actualizar el pago.");
      actualizarEstadoLocal(claseId, jugadorId, action === "pagado" ? "PAGADO" : "PENDIENTE");
      render();
    }

    function bindEvents() {
      document.getElementById("jugador-filter").addEventListener("input", (event) => {
        state.filter = event.target.value;
        state.pageByPlayer.clear();
        render();
      });

      document.getElementById("players-container").addEventListener("click", async (event) => {
        const pageBtn = event.target.closest("button[data-page-action]");
        if (pageBtn) {
          const key = pageBtn.dataset.playerKey;
          const current = state.pageByPlayer.get(key) || 1;
          state.pageByPlayer.set(key, pageBtn.dataset.pageAction === "next" ? current + 1 : current - 1);
          render();
          return;
        }

        const actionBtn = event.target.closest("button[data-action]");
        if (!actionBtn) return;

        actionBtn.disabled = true;
        try {
          await cambiarPago({
            action: actionBtn.dataset.action,
            metodo: actionBtn.dataset.metodo || "",
            claseId: actionBtn.dataset.claseId,
            jugadorId: actionBtn.dataset.jugadorId,
          });
        } catch (error) {
          alert(error.message || "No se pudo actualizar el pago.");
          actionBtn.disabled = false;
        }
      });
    }

    (async function init() {
      bindEvents();
      showLoading(true);
      try {
        const username = await waitForUserInfo();
        const ctx = await cargarContextoUsuario(username);
        state.username = ctx?.username || "";
        state.role = String(ctx?.role || "").trim().toLowerCase();

        if (state.role !== "entrenador") {
          document.getElementById("blocked").hidden = false;
          return;
        }

        document.getElementById("app").hidden = false;
        await cargarClases();
      } catch (error) {
        console.error(error);
        alert(error.message || "No se pudo cargar la pantalla de pagos.");
      } finally {
        showLoading(false);
      }
    })();
  </script>
</body>
</html>

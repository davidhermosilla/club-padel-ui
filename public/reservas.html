<!doctype html>

<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
      name="viewport"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <title>Reserva de Pistas</title>
    <style>
      .calendar-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin-bottom: 40px;
      }

      .calendar-action-button {
        padding: 10px 16px;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .calendar-action-button:hover {
        background-color: #0056b3;
      }

      .schedule-container {
        display: grid;
        grid-template-columns: repeat(
          6,
          1fr
        ); /* 5 pistas + 1 columna para las horas */
        gap: 10px;
        width: 100%;
        min-width: 720px;
        max-width: 1500px;
        margin-bottom: 100px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .pista-header,
      .time-slot,
      .time-slot-no-user {
        background-color: #007bff;
        color: white;
        padding: 15px;
        text-align: center;
        border-radius: 5px;
      }

      .time-slot-booked,
      .time-slot-booked-no-user {
        background-color: #d32f2f;
        color: white;
        padding: 15px;
        text-align: center;
        border-radius: 5px;
      }

      .time-slot-booked-class,
      .time-slot-booked-class-no-user {
        background-color: #2e7d32;
        color: white;
        padding: 15px;
        text-align: center;
        border-radius: 5px;
      }

      .pista-header {
        background-color: #0056b3;
        font-weight: bold;
      }

      .pista-header-admin {
        background-color: #0056b3;
        font-weight: bold;
      }

      .time-slot-no-user:hover {
        background-color: #007bff;
      }

      .time-slot:hover {
        background-color: #003f7f;
        cursor: pointer;
      }

      .time-slot-booked-no-user:hover {
        background-color: #d32f2f;
      }

      .time-slot-booked:hover {
        background-color: #ba1717;
        cursor: pointer;
      }

      .time-slot-booked-class-no-user:hover {
        background-color: #2e7d32;
      }

      .time-slot-booked-class:hover {
        background-color: #1f5f24;
        cursor: pointer;
      }

      .time-slot-disabled {
        background-color: #cccccc;
        color: #666666;
        padding: 15px;
        text-align: center;
        border-radius: 5px;
        pointer-events: none;
      }

      .time-label {
        background-color: #555;
        color: white;
        padding: 15px;
        text-align: center;
        border-radius: 5px;
      }
      .contenedor-centrado {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 20px;
        /*min-height: 100vh;  Opcional: Para centrar verticalmente en la página */
      }

      .contenedor {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 2px; /* Espacio entre cada .contenedor */
      }
      .container {
        display: flex;
      }
      .columna {
        flex: 1; /* Ocupa el mismo espacio cada columna */
        padding: 10px;
        margin: 5px;
      }
      .botones {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px; /* Espacio entre los botones */
      }

      .schedule-wrapper {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .schedule-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
        gap: 6px;
        min-width: 300px;
        max-width: 100%;
        margin-bottom: 100px;
      }

      .schedule-container > div {
        min-width: 80px;
        font-size: 12px;
        padding: 6px;
      }

      .time-label {
        min-width: 60px;
        font-size: 11px;
        padding: 6px;
      }

      @media (max-width: 768px) {
        .schedule-container {
          min-width: 300px;
        }
      }

      #title-details {
        background-color: #f0f8ff; /* Fondo azul claro */
        margin-top: 20px;
      }

      #title-details h2,
      h3 {
        color: #1e73be;
      }

      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 10000;
      }

      .modal-content {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        min-width: 320px;
        max-width: 520px;
        width: 92%;
      }

      .class-summary {
        text-align: left;
        margin: 12px 0;
      }

      .class-summary p {
        margin: 6px 0;
      }

      .class-players {
        margin: 8px 0 0;
        padding-left: 18px;
        max-height: 220px;
        overflow-y: auto;
      }

      .class-player-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 6px 0;
      }

      .class-player-remove {
        margin: 0;
        width: auto !important;
        min-width: 0;
        padding: 4px 8px;
        font-size: 13px;
        text-transform: none;
        letter-spacing: normal;
        line-height: 1.2;
      }

      .class-actions {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      .modal-content .class-actions button {
        margin: 0;
        width: auto;
        min-width: 0;
        padding: 10px 14px;
        text-transform: none;
        letter-spacing: normal;
        line-height: 1.2;
      }

      #modal-clase-reserva input {
        box-sizing: border-box;
        font-size: 16px;
      }

      @media (min-width: 1024px) {
        .modal-content {
          max-width: 620px;
        }
      }
    </style>
  </head>

    <script>
      // Obtener el método de pago desde radio buttons
      function getSelectedPaymentMethod() {
        const radios = document.getElementsByName("payment-method");
        for (const radio of radios) {
          if (radio.checked) {
            return radio.value;
          }
        }
        return null;
      }

      var api_url = "https://club-padel-api-12f28391bbbd.herokuapp.com";
      const scheduleContainer = document.getElementById("schedule-container");
      const timeSlots = [
        { time: "16:30 - 18:00" },
        { time: "18:00 - 19:30" },
        { time: "19:30 - 21:00" },
        { time: "21:00 - 22:30" },
      ];

      const weekendSlots = [
        { time: "09:00 - 10:30" },
        { time: "10:30 - 12:00" },
        { time: "12:00 - 13:30" },
        { time: "16:30 - 18:00" },
        { time: "18:00 - 19:30" },
        { time: "19:30 - 21:00" },
      ];

      let datosPista;
      let datosReservas;
      let firstSlotTime = "";
      let usuariosDisponibles = [];
      let usuarioSesionId = null;
      let diasExtraordinarios = []; // Almacena las fechas extraordinarias
      let claseModalContext = {
        claseId: null,
        reservaId: null,
        jugadores: [],
        reservaUsername: "",
      };

      // Función para verificar si una fecha es fin de semana o día extraordinario
      function esDiaEspecial(fecha, diaSemana) {
        // Verificar si es sábado (6) o domingo (0)
        if (diaSemana === 6 || diaSemana === 0) {
          return true;
        }
        // Verificar si la fecha está en los días extraordinarios
        return diasExtraordinarios.includes(fecha);
      }

      // Cargar días extraordinarios desde la API
      function cargarDiasExtraordinarios() {
        return new Promise((resolve, reject) => {
          $.ajax({
            url: api_url + "/dias-extraordinarios",
            type: "GET",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz",
            },
            dataType: "json",
            success: function (data) {
              // Extraer solo las fechas del array de objetos
              diasExtraordinarios = data.map((dia) => dia.fecha);
              console.log(
                "Días extraordinarios cargados:",
                diasExtraordinarios,
              );
              resolve(diasExtraordinarios);
            },
            error: function (xhr, status, error) {
              console.error("Error al obtener días extraordinarios:", error);
              // En caso de error, continuar sin días extraordinarios
              diasExtraordinarios = [];
              resolve([]);
            },
          });
        });
      }

      function renderUsuariosCombo() {
        const input = document.getElementById("user-select-modal");
        const dataList = document.getElementById("user-select-modal-options");
        if (!input || !dataList) {
          return;
        }

        const seleccionAnterior = input.value;
        dataList.innerHTML = "";

        usuariosDisponibles.forEach((usuario) => {
          const option = document.createElement("option");
          option.value = usuario.username;
          option.label = usuario.username;
          option.textContent = usuario.username;
          dataList.appendChild(option);
        });

        if (
          seleccionAnterior &&
          usuariosDisponibles.some(
            (usuario) => usuario.username === seleccionAnterior,
          )
        ) {
          input.value = seleccionAnterior;
        } else if (usuariosDisponibles.length > 0) {
          input.value = usuariosDisponibles[0].username;
        } else {
          input.value = "";
        }

        input.disabled = usuariosDisponibles.length === 0;
      }

      function cargarUsuariosCombo() {
        return new Promise((resolve) => {
          $.ajax({
            url: api_url + "/usuarios",
            type: "GET",
            headers: {
              Authorization: "Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz",
            },
            success: function (usuarios) {
              usuariosDisponibles = (usuarios || [])
                .map(function (usuario) {
                  if (typeof usuario === "string") {
                    return { id: null, username: usuario };
                  }
                  return {
                    id:
                      usuario?.id ??
                      usuario?.usuarioId ??
                      usuario?.userId ??
                      null,
                    username:
                      usuario && usuario.username ? usuario.username : "",
                  };
                })
                .filter(function (usuario) {
                  return usuario.username;
                })
                .sort(function (a, b) {
                  return a.username.localeCompare(b.username, "es", {
                    sensitivity: "base",
                  });
                });
              renderUsuariosCombo();
              resolve(usuariosDisponibles);
            },
            error: function (err) {
              console.error("Error al cargar usuarios:", err);
              resolve([]);
            },
          });
        });
      }

      async function cargarRolUsuario() {
        var username = document.getElementById("user-info").value;

        // Primero cargar los días extraordinarios
        await cargarDiasExtraordinarios();

        $.ajax({
          url: api_url + "/usuarios/buscar?username=" + username,
          type: "GET",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz",
          },
          dataType: "json",
          success: function (data) {
            // Limpiar el input hidden de roleName
            $("#role-info").empty();
            usuarioSesionId =
              data?.id ?? data?.usuarioId ?? data?.userId ?? null;
            document
              .getElementById("role-info")
              .setAttribute("value", data.rolName);
            if (
              data.rolName === "administrador" ||
              data.rolName === "entrenador"
            ) {
              cargarUsuariosCombo();
            }

            cargaPrincipal();
          },
          error: function (xhr, status, error) {
            console.error("Error al obtener datos de la API:", error);
            cargaPrincipal();
          },
        });
      }

      function obtenerReservas(todayDay) {
        return new Promise((resolve, reject) => {
          $.ajax({
            url: api_url + "/reservas/buscar?fecha=" + todayDay,
            type: "GET",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz",
            },
            dataType: "json",
            success: function (data) {
              resolve(data);
            },
            error: function (xhr, status, error) {
              reject(error);
            },
          });
        });
      }

      function obtenerDetalleReserva(reservaId) {
        return new Promise((resolve, reject) => {
          if (!reservaId) {
            resolve(null);
            return;
          }
          $.ajax({
            url: api_url + "/reservas/" + reservaId,
            type: "GET",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz",
            },
            dataType: "json",
            success: function (data) {
              resolve(data || null);
            },
            error: function (xhr, status, error) {
              reject(error);
            },
          });
        });
      }

      function sincronizarSlotTrasCrearReserva(
        slot,
        reservaId,
        usernameFallback,
        conceptoFallback,
      ) {
        obtenerDetalleReserva(reservaId)
          .then((reservaDetalle) => {
            if (!reservaDetalle) {
              return;
            }
            const usernameSesion =
              document.getElementById("user-info").value || "";
            const rolenameSesion = (
              document.getElementById("role-info").value || ""
            )
              .trim()
              .toLowerCase();
            const reservaNormalizada = {
              ...reservaDetalle,
              reservaId: reservaDetalle.reservaId ?? reservaId,
              userName:
                reservaDetalle.userName ||
                reservaDetalle.username ||
                (reservaDetalle.usuario && reservaDetalle.usuario.username) ||
                usernameFallback,
              concepto:
                reservaDetalle.concepto !== null &&
                reservaDetalle.concepto !== undefined
                  ? reservaDetalle.concepto
                  : conceptoFallback || "",
            };
            configurarTimeSlot(
              slot,
              reservaNormalizada,
              usernameSesion,
              rolenameSesion,
            );
          })
          .catch((error) => {
            console.error(
              "No se pudo sincronizar la reserva recien creada:",
              error,
            );
          });

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function obtenerRolReserva(reserva) {
        return (
          reserva?.usuario?.rol?.nombre ??
          reserva?.user?.rol?.nombre ??
          reserva?.rol?.nombre ??
          reserva?.rolName ??
          reserva?.userRol ??
          reserva?.usuarioRol ??
          ""
        );

      function esReservaConClase(reserva) {
        const rolReserva = String(obtenerRolReserva(reserva))
          .trim()
          .toLowerCase();
        return (
          (reserva?.clase !== null && reserva?.clase !== undefined) ||
          (reserva?.claseId !== null && reserva?.claseId !== undefined) ||
          rolReserva === "entrenador"

      function configurarAccionesReservaClase(
        claseId,
        jugadoresClase,
        rolActual,
        usernameSesion,
        reservaUsername,
        reservaId,
      ) {
        const modalReserva = document.getElementById("modal-clase-reserva");
        const botonReservar = document.getElementById("reservar-clase-button");
        const botonBorrarReserva = document.getElementById(
          "borrar-reserva-clase-button",
        );
        const labelSelect = document.getElementById("clase-usuario-label");
        const inputSelect = document.getElementById("clase-usuario-select");

        modalReserva.style.display = "none";
        botonReservar.style.display = "none";
        botonBorrarReserva.style.display = "none";
        labelSelect.style.display = "none";
        inputSelect.style.display = "none";
        botonReservar.disabled = false;
        botonReservar.textContent = "Reservar clase";
        botonBorrarReserva.disabled = false;

        if (!claseId) {
          return;
        }

        const totalJugadores = Array.isArray(jugadoresClase)
          ? jugadoresClase.length
          : 0;
        const claseCompleta = totalJugadores >= 4;
        const rolNormalizado = String(rolActual || "")
          .trim()
          .toLowerCase();
        const esAdminOEntrenador =
          rolNormalizado === "administrador" || rolNormalizado === "entrenador";
        const yaApuntado = (jugadoresClase || []).some(
          (j) =>
            String(j?.username || "")
              .trim()
              .toLowerCase() ===
            String(usernameSesion || "")
              .trim()
              .toLowerCase(),
        );

        if (esAdminOEntrenador) {
          const asegurarUsuarios =
            (usuariosDisponibles || []).length > 0
              ? Promise.resolve(usuariosDisponibles)
              : cargarUsuariosCombo();
          asegurarUsuarios.finally(() => {
            renderUsuariosClaseModal(jugadoresClase);
            if (inputSelect.disabled && !claseCompleta) {
              botonReservar.disabled = true;
              botonReservar.textContent = "Sin usuarios";
            }
          });
          modalReserva.style.display = "block";
          labelSelect.style.display = "inline";
          inputSelect.style.display = "inline-block";
          botonReservar.style.display = "inline-block";
          botonReservar.textContent = "Anadir jugador";
          if (claseCompleta) {
            botonReservar.disabled = true;
            botonReservar.textContent = "Clase completa";
          }
          return;
        }

        if (!usernameSesion) {
          return;
        }

        modalReserva.style.display = "block";
        botonReservar.style.display = "inline-block";
        if (
          reservaId &&
          String(usernameSesion || "")
            .trim()
            .toLowerCase() ===
            String(reservaUsername || "")
              .trim()
              .toLowerCase()
        ) {
          botonBorrarReserva.style.display = "inline-block";
        }
        if (claseCompleta) {
          botonReservar.disabled = true;
          botonReservar.textContent = "Clase completa";
        } else if (yaApuntado) {
          botonReservar.disabled = true;
          botonReservar.textContent = "Ya apuntado";
        }
      }

      function calcularPermisoCancelarClase(reserva, rolename, usernameSesion) {
        const rolNormalizado = String(rolename || "")
          .trim()
          .toLowerCase();
        const esAdministrador = rolNormalizado === "administrador";
        const esEntrenador = rolNormalizado === "entrenador";
        const usernameReserva =
          reserva?.userName ||
          reserva?.username ||
          reserva?.usuario?.username ||
          "";
        return esAdministrador || (esEntrenador && usernameReserva === usernameSesion);
      }

      function refrescarModalClase() {
        const reservaId = claseModalContext.reservaId;
        if (!reservaId) {
          return Promise.reject(new Error("No se encontro la reserva de la clase."));
        }

        const rolename = document.getElementById("role-info").value || "";
        const usernameSesion = document.getElementById("user-info").value || "";

        return obtenerDetalleReserva(reservaId).then((reservaActualizada) => {
          if (!reservaActualizada) {
            throw new Error("No se pudo refrescar la informacion de la clase.");
          }
          const reservaIdActualizada =
            reservaActualizada?.reservaId ?? reservaActualizada?.id ?? null;
          if (reservaIdActualizada && Array.isArray(datosReservas)) {
            const idx = datosReservas.findIndex(
              (r) => String(r?.reservaId ?? r?.id ?? "") === String(reservaIdActualizada),
            );
            if (idx >= 0) {
              datosReservas[idx] = { ...datosReservas[idx], ...reservaActualizada };
            }
          }
          const slotReserva = Array.from(
            document.querySelectorAll("#schedule-container [data-reserva]"),
          ).find(
            (el) => String(el?.dataset?.reserva || "") === String(reservaIdActualizada),
          );
          if (slotReserva) {
            configurarTimeSlot(slotReserva, reservaActualizada, usernameSesion, rolename);
          }
          const mostrarBotonCancelarClase = calcularPermisoCancelarClase(
            reservaActualizada,
            rolename,
            usernameSesion,
          );
          mostrarModalClase(reservaActualizada, mostrarBotonCancelarClase);
          return reservaActualizada;
        });
      }

      function manejarClickReserva(timeSlot, username, rolename) {
        const fallback = () => {
          if (rolename === "administrador") {
            mostrarPagos(
              timeSlot.dataset.reserva,
              timeSlot.dataset.pista,
              timeSlot.dataset.pistaNombre,
              timeSlot.dataset.time,
            );
          } else {
            manejarCancelacionReserva(timeSlot, username, rolename);
          }
        };

        if (!timeSlot.dataset.reserva) {
          return;
        }

        const reservaEnCache = (datosReservas || []).find(
          (r) => String(r?.reservaId) === String(timeSlot.dataset.reserva),
        );

        obtenerDetalleReserva(timeSlot.dataset.reserva)
          .then((reservaDetalle) => {
            const reservaSeleccionada = reservaDetalle || reservaEnCache;
            if (
              !reservaSeleccionada ||
              !esReservaConClase(reservaSeleccionada)
            ) {
              fallback();
              return;
            }

            const rolNormalizado = String(rolename).trim().toLowerCase();
            const esEntrenador = rolNormalizado === "entrenador";
            const esAdministrador = rolNormalizado === "administrador";
            const usernameReserva =
              reservaSeleccionada?.userName ||
              reservaSeleccionada?.username ||
              reservaSeleccionada?.usuario?.username ||
              timeSlot.dataset.username;
            const esUsuarioReserva = usernameReserva === username;
            const mostrarBotonCancelarClase =
              esAdministrador || (esEntrenador && esUsuarioReserva);

            mostrarModalClase(reservaSeleccionada, mostrarBotonCancelarClase);
          })
          .catch((error) => {
            console.error(
              "No se pudo obtener el detalle de la reserva:",
              error,
            );
            if (reservaEnCache && esReservaConClase(reservaEnCache)) {
              const rolNormalizado = String(rolename).trim().toLowerCase();
              const esEntrenador = rolNormalizado === "entrenador";
              const esAdministrador = rolNormalizado === "administrador";
              const usernameReserva =
                reservaEnCache?.userName ||
                reservaEnCache?.username ||
                reservaEnCache?.usuario?.username ||
                timeSlot.dataset.username;
              const esUsuarioReserva = usernameReserva === username;
              const mostrarBotonCancelarClase =
                esAdministrador || (esEntrenador && esUsuarioReserva);
              mostrarModalClase(reservaEnCache, mostrarBotonCancelarClase);
              return;
            }
            fallback();
          });
      }

      function multiFilter(array, filters) {
        let filterKeys = Object.keys(filters);
        return array.filter((item) =>
          filterKeys.every((key) => filters[key].indexOf(item[key]) !== -1),
        );
      }

      // Lógica para mostrar pagos y gestionar acciones
      function mostrarPagos(reservaId, pistaId, pistaNombre, slotTime) {
        const paymentsContainer = document.getElementById("payments-container");
        paymentsContainer.style.display = "block";
        const paymentsTableDiv = document.getElementById("payments-table-div");
        paymentsTableDiv.style.display = "block";

        // Set hidden fields
        document.getElementById("reservaIdPago").value = reservaId;
        document.getElementById("pistaIdPago").value = pistaId;
        document.getElementById("pistaNombre").value = pistaNombre;
        document.getElementById("slotTimePago").value = slotTime;

        const paymentsTable = document
          .getElementById("payments-table")
          .querySelector("tbody");
        paymentsTable.innerHTML = "";

        // Limpiar campos de pago
        document.getElementById("payment-amount").value = "";
        document.getElementById("payment-detail").value = "";
        document.getElementById("payment-total").innerHTML = "";
        document.getElementById("expense-amount").value = "";
        document.getElementById("expense-detail").value = "";
        document.getElementById("expenses-total").innerHTML = "";
        document.getElementById("paymentandexpenses-total").innerHTML = "";

        const reservaSlot = datosReservas.find((r) => r.reservaId == reservaId);
        const reservaUser = reservaSlot ? reservaSlot.userName : "";

        // 🔎 Localiza el DIV del slot que tiene el data-telefono
        const selectedDate = new Date(
          document.getElementById("reservation-date").value,
        );
        const mm = String(selectedDate.getMonth() + 1).padStart(2, "0");
        const dd = String(selectedDate.getDate()).padStart(2, "0");
        const yyyy = selectedDate.getFullYear();
        const diaId = `${dd}/${mm}/${yyyy}`;
        const slotEl = document.getElementById(
          `${pistaId}_${diaId}_${slotTime}`,
        );
        const telefono =
          slotEl && slotEl.dataset && slotEl.dataset.telefono
            ? slotEl.dataset.telefono
            : "";

        document.getElementById("title-details").innerHTML = `
				<h2>Pista ${pistaNombre} - ${slotTime}</h2>
				<h3>Reservada por ${reservaUser} con telefono ${telefono}</h3>
			`;

        // Mostrar concepto si eres administrador
        if (document.getElementById("role-info").value === "administrador") {
          $.ajax({
            url: api_url + "/reservas/" + reservaId,
            type: "GET",
            headers: {
              Authorization: "Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz",
            },
            success: function (reservaData) {
              const conceptoDiv = document.getElementById(
                "concepto-reserva-admin",
              );
              const conceptoInput = document.getElementById("concepto-text");
              conceptoDiv.style.display = "block";
              conceptoInput.value = reservaData.concepto || "";
            },
            error: function (error) {
              console.error(
                "Error al obtener el concepto de la reserva:",
                error,
              );
            },
          });
        }

        // Obtener pagos
        $.ajax({
          url: api_url + "/reservas/" + reservaId + "/pagos",
          type: "GET",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz",
          },
          dataType: "json",
          success: function (pagosResponse) {
            let total = 0;
            pagosResponse.pagos.forEach((pago) => {
              const row = document.createElement("tr");
              row.innerHTML = `
							<td></td>
							<td>${pago.cantidad}</td>
							<td>${pago.metodoPago}</td>
							<td>${pago.detalle || ""}</td>
							<td><button class="delete-payment" data-id="${
                pago.id
              }">Eliminar Pago</button></td>
						`;
              const cantidadNumerica = parseFloat(pago.cantidad);
              if (!isNaN(cantidadNumerica)) {
                total += cantidadNumerica;
              }
              paymentsTable.appendChild(row);
            });

            document.getElementById("payment-total").dataset.value = total;
            document.getElementById("payment-total").innerText =
              "Total de Pagos: " + total + "€";

            // Obtener y mostrar gastos
            $.ajax({
              url: api_url + "/reservas/" + reservaId + "/gastos",
              type: "GET",
              headers: {
                Authorization: "Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz",
              },
              success: function (gastosResponse) {
                let totalExpenses = 0;
                gastosResponse.gastos.forEach((gasto) => {
                  const row = document.createElement("tr");
                  row.innerHTML = `
									<td></td>
									<td>-${gasto.cantidad}</td>
									<td>${gasto.metodo}</td>
									<td>${gasto.detalle || ""}</td>
									<td><button class="delete-expense" data-id="${
                    gasto.id
                  }">Eliminar Gasto</button></td>
								`;
                  const cantidadNumerica = parseFloat(gasto.cantidad);
                  if (!isNaN(cantidadNumerica)) {
                    totalExpenses -= cantidadNumerica;
                  }
                  paymentsTable.appendChild(row);
                });

                if (totalExpenses < 0) {
                  const totalPagos = parseFloat(
                    document.getElementById("payment-total").dataset.value,
                  );
                  document.getElementById("expenses-total").innerText =
                    "Total de Gastos: " + totalExpenses + "€";
                  const resultTotal = totalPagos + totalExpenses;
                  document.getElementById(
                    "paymentandexpenses-total",
                  ).innerText = "Total: " + resultTotal + "€";
                }

                // Mostrar controles según pista
                if (pistaNombre === "BAR") {
                  document.getElementById("rapids-payments").style.display =
                    "none";
                  document.getElementById("payment-detail").value = "";
                  document.getElementById("expense-detail").value = "";
                  document.getElementById("div-expenses").style.display =
                    "block";
                } else {
                  document.getElementById("rapids-payments").style.display =
                    "flex";
                  document.getElementById("payment-detail").value = "";
                  document.getElementById("expense-detail").value = "";
                  document.getElementById("div-expenses").style.display =
                    "none";
                }
              },
              error: function (xhr, status, error) {
                console.error("Error al obtener gastos:", error);
              },
            });
          },
          error: function (xhr, status, error) {
            console.error("Error al obtener pagos:", error);
          },
        });
      }

      function agregarGasto(reservaId, gasto) {
        $.ajax({
          url: api_url + "/reservas/" + reservaId + "/gastos",
          type: "PUT",

      function procesarTablaReservas(datosPista, slots, dia, datosReservas) {
        ocultarPagos();
        firstSlotTime = slots[0].time;
        limpiarYConfigurarContenedor(datosPista.length);
        agregarHeaders(datosPista);
        agregarSlotsConReservas(datosPista, slots, dia, datosReservas);
      }

      function limpiarYConfigurarContenedor(numPistas) {
        const divTime = document.createElement("div");
        divTime.className = "time-label";
        scheduleContainer.innerHTML = "";
        scheduleContainer.appendChild(divTime);
        scheduleContainer.style.gridTemplateColumns = `repeat(${
          numPistas + 1
        }, 1fr)`;
      }

      function agregarHeaders(datosPista) {
        datosPista.forEach((pista) => {
          const header = document.createElement("div");
          header.className = "pista-header";
          header.innerHTML = `${pista.nombre}<br>(${pista.ubicacion})`;
          scheduleContainer.appendChild(header);
        });
      }

      function agregarSlotsConReservas(datosPista, slots, dia, datosReservas) {
        slots.forEach((slot) => {
          const timeLabel = crearTimeLabel(slot.time);
          scheduleContainer.appendChild(timeLabel);

          datosPista.forEach((pista) => {
            const timeSlot = crearTimeSlot(pista, slot, dia, datosReservas);
            scheduleContainer.appendChild(timeSlot);
          });
        });
      }

      function crearTimeLabel(time) {
        const timeLabel = document.createElement("div");
        timeLabel.className = "time-label";
        timeLabel.textContent = time;
        return timeLabel;
      }

      function crearTimeSlotReserva(pista, slot, dia, datosReservas) {
        const timeSlot = document.createElement("div");
        timeSlot.id = `${pista.id}_${dia}_${slot.time}`;
        timeSlot.dataset.pista = pista.id;
        timeSlot.dataset.pistaNombre = pista.nombre;
        timeSlot.dataset.time = slot.time;

        const { username, rolename } = obtenerDatosUsuario();
        const reserva = obtenerReserva(datosReservas, pista.id, slot.time);

        configurarTimeSlot(timeSlot, reserva, username, rolename);
        agregarEventListener(timeSlot, dia, username, rolename);

        return timeSlot;
      }

      function crearTimeSlotBar(pista, slot, dia, datosReservas) {
        if (slot.time === firstSlotTime) {
          return crearTimeSlotReserva(pista, slot, dia, datosReservas);
        }

        const timeSlot = document.createElement("div");
        timeSlot.className = "time-slot-disabled";
        timeSlot.textContent = "No Reservable";
        return timeSlot;
      }

      function crearTimeSlot(pista, slot, dia, datosReservas) {
        if (pista.nombre !== "BAR") {
          return crearTimeSlotReserva(pista, slot, dia, datosReservas);
        } else {
          return crearTimeSlotBar(pista, slot, dia, datosReservas);
        }
      }

      function obtenerDatosUsuario() {
        return {
          username: document.getElementById("user-info").value,
          rolename: document.getElementById("role-info").value,
        };
      }

      function obtenerReserva(datosReservas, pistaId, slotTime) {
        const filters = { pistaId: [pistaId], slotTime: [slotTime] };
        return multiFilter(datosReservas, filters)[0] || null;
      }

      function configurarTimeSlot(timeSlot, reserva, username, rolename) {
        const selectedDate = document.getElementById("reservation-date").value;
        const slotTime = timeSlot.dataset.time;
        const [startHour, startMinute] = slotTime
          .split("-")[0]
          .trim()
          .split(":");

        const dateObj = new Date(selectedDate); // formato yyyy-mm-dd
        const slotDate = new Date(
          dateObj.getFullYear(),
          dateObj.getMonth(),
          dateObj.getDate(),
          Number(startHour),
          Number(startMinute),
        );

        if (reserva) {
          const tieneClaseAsociada = esReservaConClase(reserva);
          const userNameReserva =
            reserva?.userName ||
            reserva?.username ||
            reserva?.usuario?.username ||
            "-";
          const conceptoReserva =
            reserva?.concepto !== null && reserva?.concepto !== undefined
              ? reserva.concepto
              : "";
          const reservaId = reserva?.reservaId ?? reserva?.id ?? "";
          const numeroJugadoresClase =
            reserva.clase && Array.isArray(reserva.clase.jugadores)
              ? reserva.clase.jugadores.length
              : 0;
          const claseCompleta = tieneClaseAsociada && numeroJugadoresClase >= 4;

          timeSlot.innerHTML = `<span>Reservada</span><br><span>${
            userNameReserva
          }</span>${
            conceptoReserva ? `<br><span>${conceptoReserva}</span>` : ""
          }`;
          timeSlot.dataset.estado = "Reservada";
          timeSlot.dataset.reserva = reservaId;
          timeSlot.dataset.username = userNameReserva;
          timeSlot.dataset.concepto = conceptoReserva;
          timeSlot.dataset.telefono = "";
          timeSlot.dataset.tieneClase = tieneClaseAsociada ? "true" : "false";
          timeSlot.dataset.claseId =
            reserva?.clase?.id ?? reserva?.claseId ?? "";
          // 1. Obtener el telefono del usuario
          fetch(club_ajaxurl, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({
              action: "obtener_email_usuario",
              username: userNameReserva,
            }),
          })
            .then((res) => res.json())
            .then((data) => {
              if (data.success) {
                const telefono = data.data.telefono;
                timeSlot.dataset.telefono = telefono;
              }
            })
            .catch((error) => {
              console.error("Error al obtener el telefono:", error);
            });

          if (tieneClaseAsociada && !claseCompleta) {
            timeSlot.className =
              username !== ""
                ? "time-slot-booked-class"
                : "time-slot-booked-class-no-user";
          } else {
            timeSlot.className =
              username !== "" ? "time-slot-booked" : "time-slot-booked-no-user";
          }
        } else {
          timeSlot.innerHTML = "<span>Disponible</span><br><span></span>";
          timeSlot.dataset.estado = "Disponible";
          timeSlot.dataset.concepto = "";
          timeSlot.dataset.tieneClase = "false";
          timeSlot.dataset.claseId = "";
          timeSlot.className =
            username !== "" ? "time-slot" : "time-slot-no-user";
        }

        const rolNormalizado = String(rolename || "")
          .trim()
          .toLowerCase();
        const ahora = new Date();
        const esSlotPasado = slotDate.getTime() < ahora.getTime();

        // Solo bloqueamos clics si el slot es pasado y no es administrador.
        if (esSlotPasado && rolNormalizado !== "administrador") {
          timeSlot.style.pointerEvents = "none";
        } else {
          timeSlot.style.pointerEvents = "auto";
        }
      }

      function agregarEventListener(timeSlot, dia, username, rolename) {
        timeSlot.addEventListener("click", () => {
          if (!dia) {
            alert("Por favor, selecciona una fecha antes de reservar.");
            return;
          }

          if (timeSlot.dataset.estado === "Reservada") {
            manejarClickReserva(timeSlot, username, rolename);
          } else {
            manejarNuevaReserva(timeSlot, username);
          }
        });
      }

      function manejarCancelacionReserva(timeSlot, username, rolename) {
        if (
          rolename !== "administrador" &&

        ) {
          const text = "¿Desea realmente cancelar la pista?";
          if (confirm(text)) {
            cancelarReserva(timeSlot);
          }
        }
      }

            .catch((error) => {
              alert(error.message || "No se pudo eliminar el jugador.");
              console.error("Error al eliminar jugador de clase:", error);
            })
            .finally(() => {
              botonEliminar.disabled = false;
            });
        });

      document
        .getElementById("borrar-reserva-clase-button")
        .addEventListener("click", () => {
          const reservaId = claseModalContext.reservaId;
          const reservaUsername = String(claseModalContext.reservaUsername || "");
          const usernameSesion = String(
            document.getElementById("user-info").value || "",
          );
          const rolActual = String(
            document.getElementById("role-info").value || "",
          )
            .trim()
            .toLowerCase();
          const esAdminOEntrenador =
            rolActual === "administrador" || rolActual === "entrenador";

          if (!reservaId) {
            alert("No se ha encontrado la reserva.");
            return;
          }

          if (
            !esAdminOEntrenador &&
            String(usernameSesion || "")
              .trim()
              .toLowerCase() !==
              String(reservaUsername || "")
                .trim()
                .toLowerCase()
          ) {
            alert("Solo puedes borrar una reserva hecha por ti.");
            return;
          }

          if (!confirm("¿Desea realmente borrar la reserva?")) {
            return;
          }

          cancelarClase(reservaId)
            .then(() => {
              cerrarModalClase();
              document
                .getElementById("reservation-date")
                .dispatchEvent(new Event("change"));
            })
            .catch((error) => {
              alert(error.message || "No se pudo borrar la reserva.");
              console.error("Error al borrar reserva:", error);
            });
        });

      function anadirPago(cantidad, metodoPago, detalle) {
        var reservaId = document.getElementById("reservaIdPago").value;
        document.getElementById("payment-amount").value = cantidad;
        document.querySelector(
          `input[name='payment-method'][value='${metodoPago}']`,
        ).checked = true;
        document.getElementById("payment-detail").value = detalle;
        const newPayment = {
          cantidad: parseFloat(cantidad),
          metodoPago: metodoPago,
          detalle: detalle,
        };
        agregarPago(reservaId, newPayment);
      }

      document
        .getElementById("socio-propietario-contado-btn")

          anadirPago(2.5, "CONTADO", "Pago Pista socio propietario");

      document
        .getElementById("socio-deportista-contado-btn")
        .addEventListener("click", () => {

        });

      document
        .getElementById("deportista-contado-btn")
        .addEventListener("click", () => {
          anadirPago(5.5, "CONTADO", "Pago Pista deportista");

      document
        .getElementById("socio-propietario-tarjeta-btn")
        .addEventListener("click", () => {
          anadirPago(2.5, "TARJETA", "Pago Pista socio propietario");

      document
        .getElementById("socio-deportista-tarjeta-btn")
        .addEventListener("click", () => {
          anadirPago(3.5, "TARJETA", "Pago Pista socio deportista");
        });

      document
        .getElementById("deportista-tarjeta-btn")

      //Evento para manejar los gastos
      document
        .getElementById("expense-form")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          var reservaId = document.getElementById("reservaIdPago").value;
          var gasto = {
            cantidad: parseFloat(
              document.getElementById("expense-amount").value,
            ),
            metodo: document.getElementById("expense-method").value,
            detalle: document.getElementById("expense-detail").value,
          };
          agregarGasto(reservaId, gasto);
        });
      // Evento para manejar la adición de pagos
      document
        .getElementById("add-payment-form")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const reservaId = document.getElementById("reservaIdPago").value;
          const newPayment = {
            cantidad: parseFloat(
              document.getElementById("payment-amount").value,
            ),
            metodoPago: getSelectedPaymentMethod(),
            detalle: document.getElementById("payment-detail").value,
          };

          agregarPago(reservaId, newPayment);
        });

      // Delegar eventos para editar y eliminar pagos
      document
        .getElementById("payments-table")
        .addEventListener("click", function (event) {
          const row = event.target.closest("tr");
          const paymentId = event.target.dataset.id;
          const reservaId = document.getElementById("reservaIdPago").value;
          if (event.target.classList.contains("delete-payment")) {
            if (confirm("¿Desea eliminar este pago?")) {
              eliminarPago(reservaId, paymentId);
            }
          }
          if (event.target.classList.contains("delete-expense")) {
            if (confirm("¿Desea eliminar este gasto?")) {
              eliminarGasto(reservaId, paymentId);
            }
          }
        });

      document
        .getElementById("reservation-date")
        .addEventListener("change", (event) => {
          cerrarModalClase();
          const selectedDate = new Date(event.target.value);
          const day = selectedDate.getDay();
          const mm = String(selectedDate.getMonth() + 1).padStart(2, "0");
          const dd = String(selectedDate.getDate()).padStart(2, "0");
          const yyyy = selectedDate.getFullYear();

          const selectedFormatedDate = `${dd}/${mm}/${yyyy}`;

          datosReservas = [];

          obtenerReservas(selectedFormatedDate)
            .then((data) => {
              datosReservas = data;
              console.log(datosReservas);

              if (esDiaEspecial(selectedFormatedDate, day)) {
                // Sábado (6), Domingo (0) o día extraordinario
                procesarTablaReservas(
                  datosPista,
                  weekendSlots,
                  selectedFormatedDate,
                  datosReservas,
                );
              } else {
                procesarTablaReservas(
                  datosPista,
                  timeSlots,
                  selectedFormatedDate,
                  datosReservas,
                );
              }
            })
            .catch((error) => {
              console.error("Error obteniendo los datos:", error);
            });
        });

      document
        .getElementById("refresh-reservas")
        .addEventListener("click", () => {
          document
            .getElementById("reservation-date")
            .dispatchEvent(new Event("change"));
        });

      document.getElementById("go-today").addEventListener("click", () => {
        const todayDate = new Date();
        const reservationDateInput =
          document.getElementById("reservation-date");
        reservationDateInput.valueAsDate = todayDate;
        reservationDateInput.dispatchEvent(new Event("change"));
      });

      function cargaPrincipal() {
        //Autoselect today
        const todayDate = new Date();
        const todayDay = todayDate.getDay();

        const mm = String(todayDate.getMonth() + 1).padStart(2, "0");
        const dd = String(todayDate.getDate()).padStart(2, "0");
        const yyyy = todayDate.getFullYear();

        const currentDate = `${dd}/${mm}/${yyyy}`;

        console.log(currentDate);

        document.getElementById("reservation-date").valueAsDate = todayDate;
        //Cargar Reservas

        obtenerReservas(currentDate)
          .then((data) => {
            datosReservas = data;
            console.log(datosReservas);
            $.ajax({
              url: api_url + "/pistas",
              type: "GET",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz",
              },
              dataType: "json",
              success: function (data) {
                datosPista = data.sort((a, b) => {
                  if (a.nombre === "BAR") return 1;
                  if (b.nombre === "BAR") return -1;
                  return 0;
                });
                if (
                  document.getElementById("role-info").value !== "administrador"
                ) {
                  datosPista = datosPista.filter((p) => p.nombre !== "BAR");
                }
                // Renderizar las horas por defecto
                if (esDiaEspecial(currentDate, todayDay)) {
                  // Sabado (6), Domingo (0) o día extraordinario
                  procesarTablaReservas(
                    datosPista,
                    weekendSlots,
                    currentDate,
                    datosReservas,
                  );
                } else {
                  procesarTablaReservas(
                    datosPista,
                    timeSlots,
                    currentDate,
                    datosReservas,
                  );
                }
              },
              error: function (xhr, status, error) {
                console.error("Error al obtener datos de la API:", error);
              },
            });
          })
          .catch((error) => {
            console.error("Error obteniendo los datos:", error);
          });
      }

      document
        .getElementById("user-info")
        .addEventListener("userReady", function (event) {
          cargarRolUsuario();
        });

      document
        .getElementById("confirmar-reserva-admin")
        .addEventListener("click", () => {
          const userTarget = document.getElementById("user-select-modal").value;
          const usuarioValido = usuariosDisponibles.some(
            (usuario) => usuario.username === userTarget,
          );
          if (usuarioValido && slotPendienteAdmin) {
            anadirReserva(slotPendienteAdmin, userTarget);
            document.getElementById("modal-reserva-admin").style.display =
              "none";
            slotPendienteAdmin = null;
          } else if (!usuarioValido) {
            alert("Selecciona un usuario válido.");
          }
        });

      document
        .getElementById("btn-detalle-tienda")
        .addEventListener("click", () => {
          document.getElementById("payment-detail").value = "TIENDA";
        });

      document
        .getElementById("btn-detalle-bar")
        .addEventListener("click", () => {
          document.getElementById("payment-detail").value = "BAR";
        });

      document
        .getElementById("btn-detalle-pista")
        .addEventListener("click", () => {
          document.getElementById("payment-detail").value = "Pago Pista";
        });
    </script>

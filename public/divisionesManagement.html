<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<title>Gestión de Divisiones</title>
</head>
<body>

<div class="wp-block-columns is-layout-flex wp-container-core-columns-is-layout-1 wp-block-columns-is-layout-flex">
    <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:10%"></div>

    <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:80%">
        <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:10%"></div>
        <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:80%">

            <!-- Formulario para añadir nueva división -->
            <form id="form-nueva-division">
                <center><h2>Gestión de Divisiones</h2></center>
                <label>Nombre</label><input type="text" id="nombre" name="nombre" required>
                <button type="submit" id="añadir-division" class="wpforms" aria-live="assertive">Añadir Nueva División</button>
            </form>

            <!-- Formulario para editar división existente -->
            <form id="form-editar-division" style="display:none;">
                <h2>Editar División:</h2>
                <input type="hidden" id="editDivisionId" name="editDivisionId">
                <label>Nombre</label><input type="text" id="editNombre" name="editNombre" required>
                <button type="submit" id="guardar-cambios-division" class="wpforms" aria-live="assertive">Guardar Cambios</button>
                <button type="button" id="cancelar-edicion" class="wpforms">Cancelar</button>
            </form>

            <figure class="wp-block-table is-style-stripes">
                <table id="tabla-divisiones" class="has-text-color has-link-color" style="color:#1e73be">
                    <thead>
                        <tr>
                            <th class="has-text-align-center" data-align="center">ID</th>
                            <th class="has-text-align-center" data-align="center">Nombre</th>
                            <th class="has-text-align-center" data-align="center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
                <figcaption class="wp-element-caption">Tabla de divisiones</figcaption>
            </figure>
        </div>
        <div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:10%"></div>
    </div>
</div>

<script>
var api_url = "https://club-padel-api-12f28391bbbd.herokuapp.com";
$(document).ready(function(){
    // Envío del formulario de nueva división
    $('#form-nueva-division').submit(function(event){
        event.preventDefault();
        var nombre = $('#nombre').val();
        $.ajax({
            url: api_url+'/divisiones',
            type: 'POST',
            headers: {
                'Content-Type' : 'application/json',
                'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
            },
            data: JSON.stringify({ "nombre": nombre }),
            success: function(data){
                $('#nombre').val('');
                cargarDivisiones();
            },
            error: function(xhr, status, error){
                console.error('Error al añadir una nueva división:', error);
            }
        });
    });

    // Envío del formulario de edición de división
    $('#form-editar-division').submit(function(event){
        event.preventDefault();
        var id = $('#editDivisionId').val();
        var nombre = $('#editNombre').val();
        $.ajax({
            url: api_url+'/divisiones/' + id,
            type: 'PUT',
            headers: {
                'Content-Type' : 'application/json',
                'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
            },
            data: JSON.stringify({ "nombre": nombre }),
            success: function(data){
                cargarDivisiones();
                $('#form-editar-division').hide();
                $('#form-nueva-division').show();
            },
            error: function(xhr, status, error){
                console.error('Error al actualizar la división:', error);
            }
        });
    });

    // Cancelar la edición
    $('#cancelar-edicion').click(function(){
        $('#form-editar-division').hide();
        $('#form-nueva-division').show();
    });

    // Cargar divisiones y poblar la tabla
    function cargarDivisiones(){
        $.ajax({
            url: api_url+'/divisiones',
            type: 'GET',
            headers: {
                'Content-Type' : 'application/json',
                'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
            },
            dataType: 'json',
            success: function(data){
                $('#tabla-divisiones tbody').empty();
                $.each(data, function(index, division){
                    $('#tabla-divisiones tbody').append(`
                        <tr class="has-text-align-center" data-align="center">
                            <td>${division.id}</td>
                            <td>${division.nombre}</td>
                            <td>
                                <button class="editar-division" data-id="${division.id}" data-nombre="${division.nombre}">Editar</button>
                                <button class="eliminar-division" data-id="${division.id}">Eliminar</button>
                            </td>
                        </tr>
                    `);
                });
            },
            error: function(xhr, status, error){
                console.error('Error al obtener datos de la API:', error);
            }
        });
    }

    // Evento para editar una división
    $('#tabla-divisiones').on('click', '.editar-division', function(){
        var id = $(this).data('id');
        var nombre = $(this).data('nombre');
        $('#editDivisionId').val(id);
        $('#editNombre').val(nombre);
        $('#form-nueva-division').hide();
        $('#form-editar-division').show();
    });

    // Evento para eliminar una división
    $('#tabla-divisiones').on('click', '.eliminar-division', function(){
        var id = $(this).data('id');
        $.ajax({
            url: api_url+'/divisiones/' + id,
            type: 'DELETE',
            headers: {
                'Content-Type' : 'application/json',
                'Authorization': 'Basic Y2x1YnBhZGVsdXNlcjpjbHVicGFkZWxwYXNz'
            },
            success: function(){
                cargarDivisiones();
            },
            error: function(xhr, status, error){
                console.error('Error al eliminar la división:', error);
            }
        });
    });

    // Cargar divisiones al iniciar
    cargarDivisiones();
});
</script>

</body>
</html>
